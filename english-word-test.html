<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語の単語テストメーカー</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans',sans-serif;color:#263b3a;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,calc((100vw - 1200px)/2));background:#153f38;color:white}header small{color:#b7dac1;letter-spacing:2px}h1{font-size:27px;margin:8px 0}header p{margin:0;color:#d7e7de}main{max-width:1200px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:340px 1fr;gap:24px}.panel{background:white;border:1px solid #dce5df;border-radius:16px;padding:22px;margin-bottom:18px}h2{font-size:18px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #bfcfc6;border-radius:8px;background:white;font:inherit;color:inherit}textarea{min-height:125px;font-size:14px}.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}button{border:0;border-radius:8px;padding:11px 16px;background:#e8efea;color:#23463a;font:inherit;cursor:pointer}button.primary{background:#25654c;color:white;width:100%;margin-top:18px}button:hover{filter:brightness(.96)}.hint{font-size:12px;color:#60736c;line-height:1.7}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.toolbar button.active{background:#25654c;color:white}.paper{background:white;box-shadow:0 3px 20px #20392b12;padding:35px;margin-bottom:18px;min-height:680px}.paper h2{text-align:center;font-size:23px;margin:0 0 10px}.sub{text-align:center;font-size:13px}.identity{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #2a3d35;padding:18px 0;margin-bottom:18px;font-size:15px}.question{display:grid;grid-template-columns:30px 1fr 1fr;align-items:center;gap:10px;min-height:47px;border-bottom:1px solid #ccd5cf;font-size:16px}.answer{padding:6px;border-bottom:1px solid #68766e;min-height:32px}.correct{color:#215b44;font-weight:650}.choices{grid-column:2/4;font-size:13px;padding-bottom:8px}.foot{margin-top:18px;text-align:right;font-size:12px}.editrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0ed}.editrow span{flex:1;font-size:14px}.editrow button{padding:6px 9px;font-size:12px}#status{font-size:13px;color:#8b4520;margin:10px 0}.check{display:flex;gap:8px;align-items:center;font-size:13px}.check input{width:auto}.printonly{display:none}@media(max-width:850px){main{grid-template-columns:1fr}.paper{padding:20px;min-height:0}.identity{flex-wrap:wrap}.question{font-size:14px}header{padding:22px}}@page{size:A4;margin:14mm}@media print{body{background:white;color:black}header,aside,.toolbar,#editor,.previewnote{display:none!important}main{display:block;padding:0;margin:0;max-width:none}.paper{box-shadow:none;padding:0;min-height:0;break-after:page;margin:0}.paper:last-child{break-after:auto}.paper.hiddenprint{display:none}.question{min-height:12mm;break-inside:avoid}.correct{color:black}.identity{font-size:12pt}.printonly{display:block}}

.answer.english-lines{border-bottom:0;padding:0;height:40px;min-height:40px;display:block}.english-lines svg{display:block;width:100%;height:40px;overflow:visible}.english-lines line{stroke:#8a9690;stroke-width:.7}.english-lines line.baseline{stroke:#263b3a;stroke-width:1.5}.english-lines text{font-family:Arial,sans-serif;font-size:20px;fill:currentColor}
</style><header><a href="./index.html" style="display:inline-block;color:white;text-decoration:none;border:1px solid #8eafa0;border-radius:8px;padding:9px 13px;margin-bottom:16px">🏠 アプリ集へ戻る</a><br><small>ENGLISH WORKSHEET STUDIO</small><h1>英語の単語テストメーカー</h1><p>授業のことばで、テストと解答をひとまとめに。</p></header><main><aside><section class="panel"><h2>① テストの条件</h2><label for="title">テストの題名</label><input id="title" value="英語の単語テスト"><div class="row"><div><label for="grade">学年</label><select id="grade"><option>6年</option><option>5年</option><option>4年</option><option>3年</option><option>指定なし</option></select></div><div><label for="unit">単元（自由入力）</label><input id="unit" placeholder="例：Unit 3"></div></div><label for="theme">単語のテーマ</label><select id="theme"></select><div id="freebox" hidden><label for="freeTheme">自由テーマ</label><input id="freeTheme" placeholder="例：ハロウィン"><p class="hint">内蔵テーマに合う名前なら候補を表示します。自由な単語は下の欄に入力してください。</p></div><label class="check"><input type="checkbox" id="related">関連するテーマの単語も候補に加える</label><p class="hint" id="relatednote"></p><label for="custom">単語を追加・自由入力</label><textarea id="custom" placeholder="英語,日本語 の順で1行に1語&#10;apple,りんご&#10;dog,犬"></textarea><p class="hint">カンマ・タブ・＝で区切って貼り付けできます。入力内容はこのブラウザーに保存されます。</p><div class="row"><div><label for="count">問題数（1〜50）</label><input type="number" id="count" min="1" max="50" value="10"></div><div><label for="points">1問の配点</label><input type="number" id="points" min="1" max="100" value="10"></div></div><label for="format">出題形式</label><select id="format"><option value="ej">英語 → 日本語</option><option value="je">日本語 → 英語</option><option value="choice">4択（英語 → 日本語）</option><option value="mix">混合（英語・日本語）</option></select><button class="primary" id="generate">テストと解答を作る</button><div id="status" role="status" aria-live="polite"></div></section></aside><div><div class="toolbar"><button id="tabtest" class="active">テストを見る</button><button id="tabanswer">解答を見る</button><button data-print="test">テストを印刷</button><button data-print="answer">解答を印刷</button><button data-print="both">両方を印刷</button><button data-pdf="test">テストのPDFを保存</button><button data-pdf="answer">解答のPDFを保存</button><button data-pdf="both">両方のPDFを保存</button><span id="pdfstatus" role="status" aria-live="polite" class="hint"></span></div><p class="hint previewnote">② 内容を確認 → ③ 印刷。印刷画面からPDF保存もできます。20問ごとに改ページします。</p><div id="sheets"></div><section class="panel" id="editor"><h2>問題を調整する</h2><p class="hint">入れ替え・削除すると解答も同時に更新されます。</p><div id="editlist"></div></section></div></main><script src="./vendor/html2canvas.min.js"></script><script src="./vendor/jspdf.umd.min.js"></script><script>
const DATA={
'食べ物': 'apple:りんご,banana:バナナ,orange:オレンジ,grape:ぶどう,peach:もも,melon:メロン,strawberry:いちご,rice:ご飯,bread:パン,egg:卵,milk:牛乳,fish:魚,chicken:鶏肉,salad:サラダ,potato:じゃがいも,tomato:トマト,carrot:にんじん,onion:玉ねぎ',
'動物':'dog:犬,cat:猫,bird:鳥,rabbit:うさぎ,elephant:ぞう,lion:ライオン,tiger:とら,bear:くま,monkey:さる,panda:パンダ,horse:馬,cow:牛,pig:ぶた,sheep:羊,giraffe:きりん,zebra:しまうま',
'曜日・月':'Monday:月曜日,Tuesday:火曜日,Wednesday:水曜日,Thursday:木曜日,Friday:金曜日,Saturday:土曜日,Sunday:日曜日,January:1月,February:2月,March:3月,April:4月,May:5月,June:6月,July:7月,August:8月,September:9月,October:10月,November:11月,December:12月',
'教科・学校':'English:英語,Japanese:国語,math:算数,science:理科,music:音楽,art:図工,P.E.:体育,social studies:社会,home economics:家庭科,school:学校,classroom:教室,library:図書室,gym:体育館,teacher:先生,student:児童・生徒,pencil:鉛筆,notebook:ノート,eraser:消しゴム,ruler:定規',
'職業':'doctor:医師,nurse:看護師,teacher:先生,cook:料理人,baker:パン職人,farmer:農家,police officer:警察官,firefighter:消防士,singer:歌手,actor:俳優,pilot:パイロット,vet:獣医,astronaut:宇宙飛行士',
'スポーツ・動作':'soccer:サッカー,baseball:野球,basketball:バスケットボール,tennis:テニス,volleyball:バレーボール,swimming:水泳,run:走る,walk:歩く,jump:跳ぶ,swim:泳ぐ,sing:歌う,dance:踊る,read:読む,write:書く,play:遊ぶ・する',
'色・形':'red:赤,blue:青,yellow:黄,green:緑,white:白,black:黒,pink:ピンク,purple:紫,brown:茶色,orange:オレンジ色,circle:円,triangle:三角形,square:正方形,star:星,heart:ハート',
'ハロウィン':'pumpkin:かぼちゃ,ghost:おばけ,witch:魔女,bat:こうもり,spider:くも,candy:あめ,monster:怪物,skeleton:がいこつ,costume:仮装の衣装,black cat:黒猫',
'数':'one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20'};
const LINKS={'食べ物':['色・形'],'動物':['色・形','ハロウィン'],'曜日・月':['数'],'教科・学校':['職業'],'職業':['教科・学校'],'スポーツ・動作':['教科・学校'],'色・形':['数'],'ハロウィン':['動物','色・形'],'数':['曜日・月']};
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let questions=[],pool=[],view='test',meta={};
$('theme').innerHTML=Object.keys(DATA).concat('自由').map(t=>`<option>${t}</option>`).join('');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function themeName(){return $('theme').value==='自由'?$('freeTheme').value.trim():$('theme').value}
function updateTheme(){ $('freebox').hidden=$('theme').value!=='自由';$('relatednote').textContent='関連テーマ：'+((LINKS[themeName()]||[]).join('・')||'なし（自由入力で追加できます）')}
function parseCustom(){let bad=0;const rows=$('custom').value.split('\n').filter(s=>s.trim()).map(s=>{let p=s.split(/[,，\t＝=]/);if(p.length<2||!p[0].trim()||!p.slice(1).join(',').trim()){bad++;return null}return {en:p[0].trim(),ja:p.slice(1).join(',').trim()}}).filter(Boolean);return {rows,bad}}
function getPool(){const name=themeName(),names=[name,...($('related').checked?(LINKS[name]||[]):[])],base=names.flatMap(t=>(DATA[t]||'').split(',').filter(Boolean).map(s=>{const [en,ja]=s.split(':');return{en,ja}}));const parsed=parseCustom(),map=new Map;[...base,...parsed.rows].forEach(w=>map.set(w.en.toLowerCase(),w));return {words:[...map.values()],bad:parsed.bad}}
function makeQuestion(w,i){const f=$('format').value;const dir=f==='je'||(f==='mix'&&i%2)?'je':'ej';let choices=[];if(f==='choice'){const alternatives=[...new Set(pool.filter(x=>x.ja!==w.ja).map(x=>x.ja))];choices=shuffle([w.ja,...shuffle(alternatives).slice(0,3)])}return {...w,dir,choices}}
function generate(){const p=getPool();if(p.bad){$('status').textContent=`区切りのない行が${p.bad}行あります。「英語,日本語」に直してください。`;return}pool=p.words;const n=Number($('count').value),points=Number($('points').value);if(!Number.isInteger(n)||n<1||n>50||!Number.isInteger(points)||points<1||points>100){$('status').textContent='問題数は1〜50、配点は1〜100の整数にしてください。';return}if(pool.length<n){$('status').textContent=`候補は${pool.length}語です。問題数を減らすか、単語・関連語を追加してください。`;return}if($('format').value==='choice'&&new Set(pool.map(x=>x.ja)).size<4){$('status').textContent='4択には意味の異なる単語を4語以上用意してください。';return}meta={title:$('title').value.trim()||'英語の単語テスト',grade:$('grade').value,unit:$('unit').value.trim(),theme:themeName(),points};questions=shuffle(pool).slice(0,n).map(makeQuestion);$('status').textContent=`${n}問・${n*points}点満点のテストを作成しました。`;save();render()}
function sheets(type){let out='';for(let start=0;start<questions.length;start+=20){const qs=questions.slice(start,start+20),answer=type==='answer';out+=`<section class="paper ${type}" data-type="${type}"><h2>${escapeHTML(meta.title)}${answer?'【解答】':''}</h2><div class="sub">${escapeHTML([meta.unit,meta.theme].filter(Boolean).join(' ／ '))}　1問 ${meta.points}点</div><div class="identity"><span>${meta.grade==='指定なし'?'　年':escapeHTML(meta.grade)}　　組　　番</span><span>名前：________________</span><span>点数：____ / ${questions.length*meta.points}</span></div><div class="hint">${answer?'解答欄に正解を示しています。':'日本語または英語を書きましょう。選択問題は記号を書きましょう。'}</div>${qs.map((q,j)=>{let key=q.dir==='ej'?q.ja:q.en;if(q.choices.length)key='ABCD'[q.choices.indexOf(q.ja)]+'（'+q.ja+'）';return `<div class="question"><span>${start+j+1}.</span><span>${escapeHTML(q.dir==='ej'?q.en:q.ja)}</span><span class="answer ${answer?'correct':''} ${q.dir==='je'&&!q.choices.length?'english-lines':''}">${q.dir==='je'&&!q.choices.length?`<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="英語の4本罫線${answer?'・解答 '+escapeHTML(key):''}"><line x1="0" x2="100%" y1="4" y2="4"/><line x1="0" x2="100%" y1="13" y2="13"/><line class="baseline" x1="0" x2="100%" y1="26" y2="26"/><line x1="0" x2="100%" y1="35" y2="35"/>${answer?`<text x="6" y="26">${escapeHTML(key)}</text>`:''}</svg>`:(answer?escapeHTML(key):'&nbsp;')}</span>${q.choices.length?`<div class="choices">${q.choices.map((c,k)=>'ABCD'[k]+'. '+escapeHTML(c)).join('　 /　')}</div>`:''}</div>`}).join('')}<div class="foot">${Math.floor(start/20)+1} / ${Math.ceil(questions.length/20)}</div></section>`}return out}
function render(){ $('sheets').innerHTML=sheets('test')+sheets('answer');document.querySelectorAll('.paper').forEach(e=>e.style.display=e.dataset.type===view?'block':'none');$('tabtest').classList.toggle('active',view==='test');$('tabanswer').classList.toggle('active',view==='answer');$('editlist').innerHTML=questions.map((q,i)=>`<div class="editrow"><span>${i+1}. ${escapeHTML(q.en)} ／ ${escapeHTML(q.ja)}</span><button data-replace="${i}">入れ替え</button><button data-remove="${i}">削除</button></div>`).join('')}
function save(){try{localStorage.setItem('wordTestV1',JSON.stringify({settings:Object.fromEntries(['title','grade','unit','theme','freeTheme','custom','count','points','format'].map(k=>[k,$(k).value])),related:$('related').checked,questions,pool,meta}))}catch{ $('status').textContent+=' このブラウザーには保存できません。'}}
$('generate').onclick=generate;$('theme').onchange=updateTheme;$('freeTheme').oninput=updateTheme;$('tabtest').onclick=()=>{view='test';render()};$('tabanswer').onclick=()=>{view='answer';render()};
$('editlist').onclick=e=>{if(e.target.dataset.replace!==undefined){const i=Number(e.target.dataset.replace),used=new Set(questions.map(q=>q.en)),candidates=pool.filter(w=>!used.has(w.en));if(!candidates.length){$('status').textContent='未使用の単語がありません。候補を追加して作り直してください。';return}questions[i]=makeQuestion(shuffle(candidates)[0],i)}else if(e.target.dataset.remove!==undefined){if(questions.length===1){$('status').textContent='最低1問は必要です。';return}questions.splice(Number(e.target.dataset.remove),1)}else return;save();render();$('status').textContent='テストと解答を更新しました。'};
document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.paper').forEach(e=>{e.classList.toggle('hiddenprint',b.dataset.print!=='both'&&e.dataset.type!==b.dataset.print);e.style.display='block'});window.print();render()});

let pdfBusy=false;
async function savePDF(kind){
 if(pdfBusy)return;
 const message=$('pdfstatus'),buttons=[...document.querySelectorAll('[data-pdf]')];
 if(!window.html2canvas||!window.jspdf){message.textContent='PDFの準備ができません。ページを再読み込みしてください。';return}
 pdfBusy=true;buttons.forEach(b=>b.disabled=true);message.textContent='PDFを作成しています…';
 const stage=document.createElement('div');
 stage.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:white;color:#263b3a;pointer-events:none';
 document.body.appendChild(stage);
 try{
  await document.fonts.ready;
  const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const source=[...document.querySelectorAll('.paper')].filter(p=>kind==='both'||p.dataset.type===kind);
  let page=0;
  for(const paper of source){
   const copy=paper.cloneNode(true);
   copy.classList.remove('hiddenprint');
   copy.style.cssText='display:block;width:794px;min-height:0;margin:0;padding:53px;box-shadow:none;background:white';
   stage.appendChild(copy);
   const canvas=await window.html2canvas(copy,{scale:2,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0});
   const pageHeight=canvas.width*297/210;
   for(let y=0;y<canvas.height;y+=pageHeight){
    if(page++)pdf.addPage();
    const height=Math.min(pageHeight,canvas.height-y);
    const slice=document.createElement('canvas');slice.width=canvas.width;slice.height=Math.ceil(height);
    const ctx=slice.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,y,canvas.width,height,0,0,slice.width,height);
    pdf.addImage(slice.toDataURL('image/png'),'PNG',0,0,210,height*210/canvas.width);
   }
   copy.remove();
  }
  const label={test:'テスト',answer:'解答',both:'テストと解答'}[kind];
  pdf.save((meta.title+'_'+label).replace(/[\\/:*?"<>|]/g,'_')+'.pdf');
  message.textContent='PDFを作成しました。iPhoneでは共有メニューから「ファイルに保存」を選べます。';
 }catch(error){message.textContent='PDFを作成できませんでした。もう一度お試しください。';}
 finally{stage.remove();pdfBusy=false;buttons.forEach(b=>b.disabled=false)}
}
document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>savePDF(b.dataset.pdf));

try{const s=JSON.parse(localStorage.getItem('wordTestV1'));if(s){Object.entries(s.settings).forEach(([k,v])=>{if($(k))$(k).value=v});$('related').checked=s.related;questions=s.questions;pool=s.pool;meta=s.meta}}catch{}updateTheme();if(questions.length)render();else generate();
</script></html>
