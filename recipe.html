<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#ffd76e">
<title>食材レシピメーカー｜アプリ集</title>
<style>
:root{--ink:#3d4154;--muted:#74788a;--shadow:0 13px 28px rgba(70,72,105,.13)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 10%,#fff1b8 0 9%,transparent 10%),radial-gradient(circle at 92% 16%,#ddf6e8 0 10%,transparent 11%),linear-gradient(140deg,#fffdf4,#f4fff9)}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 36px}
.home{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#5d6173;background:#fff;padding:9px 13px;border-radius:999px;font-weight:900;box-shadow:0 6px 16px rgba(70,72,105,.1)}
.hero{text-align:center;margin:18px 0 22px}.hero .emoji{font-size:54px}h1{font-size:clamp(30px,7vw,45px);margin:4px 0 7px}.hero p{margin:0;color:var(--muted);font-weight:700}
.card{background:#fff;border:2px solid #fff;border-radius:25px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.option{display:block;text-decoration:none;color:inherit;border-radius:21px;padding:18px;margin:12px 0}
.student{background:#eef9ff;border:2px solid #d6edff}.teacher{background:#fff8e4;border:2px solid #fbe9ac}
.option h2{margin:0 0 5px;font-size:24px}.option p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.open{margin-top:13px;font-weight:1000;text-align:right}.student .open{color:#4b8fdb}.teacher .open{color:#b47b22}
.copy-row{display:flex;gap:8px;margin-top:12px}.copy-row input{flex:1;min-width:0;border:2px solid #e6e8ef;border-radius:13px;padding:10px;font-size:13px;background:#fff}.copy-row button{border:0;border-radius:13px;padding:10px 13px;font-weight:900;background:#eaf2ff;color:#477ec5}
#copyMsg{text-align:center;min-height:20px;color:#438665;font-size:13px;font-weight:800;margin-top:5px}
.info{margin-top:18px;padding:15px 17px;background:#fff;border-radius:18px;color:#687083;font-size:13px;line-height:1.65;box-shadow:0 7px 18px rgba(70,72,105,.07)}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="./index.html">🏠 アプリ集へ戻る</a>
<div class="hero"><div class="emoji">🥕🍳</div><h1>食材レシピメーカー</h1><p>使うページを選んでください</p></div>
<div class="card">
<a class="option student" href="https://shokuzai-recipe-maker.ht139.chatgpt.site/"><h2>👧👦 児童用</h2><p>材料を選んでレシピを考えるページです。児童へ配布する場合はこちらを使います。</p><div class="open">児童用を開く →</div></a>
<a class="option teacher" href="https://shokuzai-recipe-maker.ht139.chatgpt.site/teacher"><h2>👩‍🏫 先生用・レシピ管理</h2><p>新しいレシピの登録、登録済みレシピの編集、食材管理などを行うページです。</p><div class="open">先生用を開く →</div></a>
</div>
<div class="card"><strong>📤 児童に配るURL</strong><div class="copy-row"><input id="studentUrl" value="https://shokuzai-recipe-maker.ht139.chatgpt.site/" readonly><button type="button" onclick="copyStudentUrl()">コピー</button></div><div id="copyMsg"></div></div>
<div class="info">🔒 アプリ集側には先生用の合言葉を保存していません。先生用ページを開いた後、レシピメーカー側の認証を使用します。<br><br>※「児童用 公開中／公開終了」の切り替えは次の段階で追加します。</div>
</div>
<script>
async function copyStudentUrl(){const url=document.getElementById('studentUrl').value;const msg=document.getElementById('copyMsg');try{await navigator.clipboard.writeText(url);msg.textContent='✅ 児童用URLをコピーしました';}catch(e){const input=document.getElementById('studentUrl');input.select();document.execCommand('copy');msg.textContent='✅ 児童用URLをコピーしました';}}
</script>
</body>
</html>
