<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提出チェック GitHub安定版</title>
<style>
:root{--blue:#5b91e5;--green:#51b77e;--ink:#344054;--muted:#718096}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:#f4f8ff}
.wrap{max-width:980px;margin:auto;padding:14px}
.home{display:inline-block;text-decoration:none;color:#526177;background:#fff;border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 5px 15px rgba(60,70,90,.1)}
h1{text-align:center;margin:14px 0 5px}.sub{text-align:center;color:var(--muted);margin-bottom:14px}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 9px 22px rgba(55,70,100,.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{font-weight:800;font-size:13px;flex:1;min-width:110px}
input{width:100%;padding:11px;border:2px solid #e2e7ef;border-radius:13px;font-size:16px;margin-top:5px}
button{border:0;border-radius:13px;padding:11px 14px;font-size:15px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.secondary{background:#edf2f7;color:#4d5a6d}.danger{background:#fff0f0;color:#bd5555}
.choice-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.choice-btn{border:2px solid #dfe6f0;background:#f6f8fb;color:#455468;min-width:58px;padding:10px 14px;border-radius:14px;font-weight:900}
.choice-btn.active{background:#e8f2ff;border-color:#6d9fe8;color:#316dbd}
.items{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.item-chip{background:#f2f5f9;border:2px solid transparent;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}
.item-chip.active{background:#eaf3ff;border-color:#74a7ec;color:#376fb9}
.scanbox{display:grid;grid-template-columns:1fr auto;gap:8px}
#scanInput{font-size:24px;font-weight:900;text-align:center;border:3px solid #79aaf0}
.status{text-align:center;border-radius:18px;padding:18px;margin-top:12px;font-size:22px;font-weight:1000;background:#f2f5f8;min-height:72px;display:flex;align-items:center;justify-content:center}
.status.ok{background:#e9f8ef;color:#2f895b}.status.warn{background:#fff7df;color:#9b6a13}.status.err{background:#fff0f0;color:#b94b4b}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.pill{padding:8px 12px;border-radius:999px;background:#eef3f8;font-weight:800}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:9px;border-bottom:1px solid #e8ebf0;text-align:center}th{background:#f6f8fb;position:sticky;top:0}.yes{font-weight:1000;color:#29925c}
.check-btn{border:0;background:#e8f8ef;color:#25875a;border-radius:10px;padding:6px 10px;font-weight:1000;font-size:18px}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.version{display:inline-block;background:#5b91e5;color:#fff;border-radius:999px;padding:4px 8px;font-size:13px}
@media(max-width:600px){.scanbox{grid-template-columns:1fr}.status{font-size:19px}}

.leave-modal{
  position:fixed;inset:0;background:rgba(20,28,42,.42);
  display:none;align-items:center;justify-content:center;
  padding:20px;z-index:9999
}
.leave-modal.show{display:flex}
.leave-card{
  width:min(520px,100%);background:#fff;border-radius:24px;
  padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.2);text-align:center
}
.leave-card h2{margin:0 0 8px}
.leave-card p{color:#667085;line-height:1.6}
.leave-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.leave-actions button,.leave-actions a{
  display:block;width:100%;text-decoration:none;border:0;border-radius:14px;
  padding:13px;font-size:16px;font-weight:900
}
.leave-backup{background:#5b91e5;color:#fff}
.leave-go{background:#eef2f6;color:#465365}
.leave-cancel{background:#fff4e3;color:#9b6815}

</style>
</head>
<body>
<div class="wrap">
<button type="button" class="home" onclick="openLeaveModal()" style="border:0;cursor:pointer">🏠 アプリ集に戻る</button>
<h1>📚 提出チェック <span class="version">GitHub v7</span></h1>
<div class="sub">Bluetoothバーコードリーダーで「ピッ」と読むだけ</div>

<div class="card">
  <strong>クラス設定</strong>
  <div class="row" style="margin-top:8px">
    <label>年度<input id="year" type="number" value="2026"></label>
    <label>人数<input id="count" type="number" value="38" min="1" max="40"></label>
  </div>
  <div class="choice-row"><strong>学年</strong><div id="gradeButtons"></div></div>
  <div class="choice-row"><strong>組</strong><div id="classButtons"></div></div>
  <div id="currentClass" class="small"></div>
</div>

<div class="card">
  <strong>提出項目</strong>
  <div class="row" style="margin-top:8px">
    <label style="flex:3">新しい項目<input id="newItem" type="text" placeholder="例：夏休みドリル"></label>
    <button class="green" onclick="addItem()">＋ 項目追加</button>
  </div>
  <div id="items" class="items"></div>
</div>

<div class="card">
  <strong>バーコード読み取り</strong>
  <div id="selectedItemLabel" class="small" style="font-weight:900;color:#376fb9;margin-top:6px">選択中：なし</div>
  <div class="scanbox" style="margin-top:10px">
    <input id="scanInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="none" placeholder="バーコードを読み取る">
    <button class="primary" onclick="processScan()">登録</button>
  </div>
  <div id="status" class="status">項目を選んで読み取りを開始してください</div>
  <div id="lastScan" class="small" style="text-align:center;margin-top:6px">読み取り値：－</div>
  <div class="summary" id="summary"></div>
</div>

<div class="card">
  <div class="row">
    <strong style="flex:1">一覧</strong>
    <button id="dateToggleBtn" class="secondary" onclick="toggleDateView()">提出日表示</button>
    <button class="secondary" onclick="makeAllPdf(false)">一覧PDF</button>
    <button class="secondary" onclick="makeAllPdf(true)">提出日入りPDF</button>
    <button class="secondary" onclick="makeMissingPdf()">未提出PDF</button>
  </div>
  <div class="table-wrap"><table id="table"></table></div>
  <div style="margin-top:14px;padding-top:12px;border-top:1px solid #e5e9ef">
  <div class="row">
    <button class="secondary" onclick="showMissingList()">未提出者一覧</button>
    <button class="secondary" onclick="clearSelectedChecks()">選択中の項目のチェックを全て消す</button>
  </div>
  <div id="missingList" class="small" style="margin-top:10px"></div>
</div>
<div id="pdfStatus" class="small" style="margin-top:8px"></div>
</div>

<div class="card">
  <strong>📦 バックアップ・復元</strong>
  <div class="row" style="margin-top:10px">
    <button class="secondary" onclick="exportBackup()">バックアップを保存</button>
    <button class="secondary" onclick="document.getElementById('backupFile').click()">バックアップを読み込む</button>
    <input id="backupFile" type="file" accept=".json,application/json" style="display:none">
  </div>
  <div id="backupStatus" class="small" style="margin-top:8px">バックアップ未実行</div>
</div>

<div class="card">
  <strong>項目管理</strong>
  <div id="itemManager"></div>
</div>
</div>

<div id="leaveModal" class="leave-modal">
  <div class="leave-card">
    <h2>📦 バックアップしましたか？</h2>
    <p>提出記録を残しておくため、終了前のバックアップをおすすめします。</p>
    <div class="leave-actions">
      <button class="leave-backup" onclick="backupAndReturn()">バックアップしてから戻る</button>
      <a class="leave-go" href="./index.html">バックアップせず戻る</a>
      <button class="leave-cancel" onclick="closeLeaveModal()">まだ戻らない</button>
    </div>
  </div>
</div>

<script>
const KEY='submission-check-github-v1';
let showDates=false;
let state={year:2026,grade:6,classNo:1,count:38,items:[],selectedItem:null,records:{}};
let scanTimer=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state=s;}catch(e){}
  document.getElementById('year').value=state.year;
  document.getElementById('count').value=state.count;
  renderAll();focusScan();
}
function pad2(n){return String(n).padStart(2,'0');}
function studentId(n){return `${state.year}-${state.grade}-${state.classNo}-${pad2(n)}`;}

function setGrade(g){state.grade=g;save();renderAll();focusScan();}
function setClassNo(c){state.classNo=c;save();renderAll();focusScan();}
function applyTop(){
  state.year=Number(document.getElementById('year').value);
  state.count=Number(document.getElementById('count').value);
  save();renderAll();focusScan();
}
document.getElementById('year').addEventListener('change',applyTop);
document.getElementById('count').addEventListener('change',applyTop);

function renderClassButtons(){
  const gb=document.getElementById('gradeButtons'), cb=document.getElementById('classButtons');
  gb.innerHTML='';cb.innerHTML='';
  for(let g=1;g<=6;g++){const b=document.createElement('button');b.className='choice-btn'+(state.grade===g?' active':'');b.textContent=g+'年';b.onclick=()=>setGrade(g);gb.appendChild(b);}
  for(let c=1;c<=4;c++){const b=document.createElement('button');b.className='choice-btn'+(state.classNo===c?' active':'');b.textContent=c+'組';b.onclick=()=>setClassNo(c);cb.appendChild(b);}
  document.getElementById('currentClass').textContent=`選択中：${state.year}年度 ${state.grade}年${state.classNo}組 ${state.count}人`;
}

function addItem(){
  const el=document.getElementById('newItem');
  const name=el.value.trim(); if(!name)return;
  if(state.items.includes(name)){alert('同じ項目名があります。');return;}
  state.items.push(name);state.records[name]=state.records[name]||{};state.selectedItem=name;el.value='';
  save();renderAll();focusScan();
}
function selectItem(name){state.selectedItem=name;save();renderAll();focusScan();}
function deleteItem(name){
  if(!confirm(`「${name}」を削除しますか？`))return;
  state.items=state.items.filter(x=>x!==name);delete state.records[name];
  if(state.selectedItem===name)state.selectedItem=state.items[0]||null;
  save();renderAll();
}

function normalizeScan(raw){
  const s=String(raw||'').normalize('NFKC').trim();
  const digits=s.replace(/[^0-9]/g,'');
  if(digits.length===8){
    return `${digits.slice(0,4)}-${Number(digits.slice(4,5))}-${Number(digits.slice(5,6))}-${digits.slice(6,8)}`;
  }
  const groups=s.match(/[0-9]+/g);
  if(groups&&groups.length===4)return `${groups[0]}-${Number(groups[1])}-${Number(groups[2])}-${String(Number(groups[3])).padStart(2,'0')}`;
  return s;
}
function scanKey(e){if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();clearTimeout(scanTimer);processScan();}}
function scanInputChanged(){clearTimeout(scanTimer);scanTimer=setTimeout(()=>{if(document.getElementById('scanInput').value.trim())processScan();},180);}
document.getElementById('scanInput').addEventListener('keydown',scanKey);
document.getElementById('scanInput').addEventListener('input',scanInputChanged);

function setStatus(text,type=''){const el=document.getElementById('status');el.className='status '+type;el.textContent=text;}
function focusScan(){setTimeout(()=>document.getElementById('scanInput').focus(),80);}

function processScan(){
  const el=document.getElementById('scanInput');
  const input=normalizeScan(el.value);el.value='';
  document.getElementById('lastScan').textContent='読み取り値：'+(input||'－');
  if(!state.selectedItem){setStatus('先に提出項目を選んでください','warn');focusScan();return;}
  const m=input.match(/^(\d{4})-(\d)-(\d+)-(\d{2})$/);
  if(!m){setStatus(`形式を確認してください：${input}`,'err');focusScan();return;}
  const y=+m[1],g=+m[2],c=+m[3],n=+m[4];
  if(y!==state.year||g!==state.grade||c!==state.classNo){setStatus('別のクラスのバーコードです','warn');focusScan();return;}
  if(n<1||n>state.count){setStatus(`${n}番は人数範囲外です`,'warn');focusScan();return;}
  const id=studentId(n), rec=state.records[state.selectedItem]||(state.records[state.selectedItem]={});
  if(rec[id]){setStatus(`⚠️ ${n}番は登録済みです`,'warn');focusScan();return;}
  rec[id]={time:new Date().toISOString()};save();renderAll();setStatus(`✅ ${n}番 ${state.selectedItem} 提出済み`,'ok');focusScan();
}
function removeCheck(item,id,n){
  if(!state.records[item]?.[id])return;
  if(!confirm(`${n}番の「${item}」を取り消しますか？`))return;
  delete state.records[item][id];save();renderAll();setStatus(`↩ ${n}番のチェックを取り消しました`,'warn');focusScan();
}




function escapePdfText(s){
  return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}

function makePdfBlobFromCanvases(canvases){
  const enc=new TextEncoder();
  const chunks=[];
  let length=0;
  const offsets=[0];

  function push(data){
    const arr=typeof data==='string'?enc.encode(data):data;
    chunks.push(arr);
    length+=arr.length;
  }
  function beginObj(n){
    offsets[n]=length;
    push(`${n} 0 obj\n`);
  }
  function endObj(){ push('endobj\n'); }

  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

  const pageCount=canvases.length;
  const pageObjs=[], imageObjs=[], contentObjs=[];
  let next=3;
  for(let i=0;i<pageCount;i++){
    pageObjs.push(next++);
    imageObjs.push(next++);
    contentObjs.push(next++);
  }
  const totalObjs=next-1;

  beginObj(1);
  push('<< /Type /Catalog /Pages 2 0 R >>\n');
  endObj();

  beginObj(2);
  push(`<< /Type /Pages /Count ${pageCount} /Kids [${pageObjs.map(n=>`${n} 0 R`).join(' ')}] >>\n`);
  endObj();

  for(let i=0;i<pageCount;i++){
    const canvas=canvases[i];
    const landscape=canvas.width>canvas.height;
    const pageW=landscape?841.89:595.28;
    const pageH=landscape?595.28:841.89;

    const dataUrl=canvas.toDataURL('image/jpeg',0.92);
    const base64=dataUrl.split(',')[1];
    const bin=atob(base64);
    const jpeg=new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++) jpeg[j]=bin.charCodeAt(j);

    beginObj(pageObjs[i]);
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 ${imageObjs[i]} 0 R >> >> /Contents ${contentObjs[i]} 0 R >>\n`);
    endObj();

    beginObj(imageObjs[i]);
    push(`<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
    push(jpeg);
    push('\nendstream\n');
    endObj();

    const content=`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
    const contentBytes=enc.encode(content);

    beginObj(contentObjs[i]);
    push(`<< /Length ${contentBytes.length} >>\nstream\n`);
    push(contentBytes);
    push('endstream\n');
    endObj();
  }

  const xref=length;
  push(`xref\n0 ${totalObjs+1}\n`);
  push('0000000000 65535 f \n');
  for(let i=1;i<=totalObjs;i++){
    push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  }
  push(`trailer\n<< /Size ${totalObjs+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);

  return new Blob(chunks,{type:'application/pdf'});
}

async function savePdf(blob,filename){
  const status=document.getElementById('pdfStatus');
  try{
    const file=new File([blob],filename,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});
      status.textContent='✅ PDFを作成しました';
      return;
    }
  }catch(e){
    if(e?.name==='AbortError') return;
  }

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  status.textContent='✅ PDFを作成しました';
}

function drawTextFit(ctx,text,x,y,maxWidth,size=24,weight='700',align='center'){
  let s=size;
  while(s>10){
    ctx.font=`${weight} ${s}px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif`;
    if(ctx.measureText(text).width<=maxWidth) break;
    s--;
  }
  ctx.textAlign=align;
  ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}

function makeAllListCanvas(items,pageNo,totalPages,includeDates){
  const W=1754,H=1240;
  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');

  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#111';

  ctx.textAlign='center';
  ctx.font='700 36px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText(includeDates?'提出日一覧':'提出状況一覧',W/2,45);

  ctx.font='500 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText(`${state.year}年度　${state.grade}年${state.classNo}組　${state.count}人`,W/2,80);

  if(totalPages>1){
    ctx.textAlign='right';
    ctx.font='500 16px sans-serif';
    ctx.fillText(`${pageNo}/${totalPages}`,W-35,45);
  }

  const left=35, top=105;
  const tableW=W-70, tableH=H-140;
  const numberW=82;
  const colW=(tableW-numberW)/Math.max(1,items.length);
  const rowH=tableH/(state.count+1);

  ctx.fillStyle='#f1f3f5';
  ctx.fillRect(left,top,tableW,rowH);
  ctx.fillStyle='#111';
  ctx.strokeStyle='#666';
  ctx.lineWidth=1;

  // grid
  ctx.beginPath();
  for(let r=0;r<=state.count+1;r++){
    const y=top+r*rowH;
    ctx.moveTo(left,y);
    ctx.lineTo(left+tableW,y);
  }
  ctx.moveTo(left,top);ctx.lineTo(left,top+tableH);
  ctx.moveTo(left+numberW,top);ctx.lineTo(left+numberW,top+tableH);
  for(let i=1;i<=items.length;i++){
    const x=left+numberW+i*colW;
    ctx.moveTo(x,top);
    ctx.lineTo(x,top+tableH);
  }
  ctx.stroke();

  drawTextFit(ctx,'番号',left+numberW/2,top+rowH/2,numberW-8,20,'700');

  items.forEach((item,i)=>{
    const x=left+numberW+i*colW+colW/2;
    drawTextFit(ctx,item,x,top+rowH/2,colW-8,20,'700');
  });

  for(let n=1;n<=state.count;n++){
    const id=studentId(n);
    const cy=top+rowH*(n+0.5);

    drawTextFit(ctx,`${n}番`,left+numberW/2,cy,numberW-8,18,'600');

    items.forEach((item,i)=>{
      if(state.records[item]?.[id]){
        const x=left+numberW+i*colW+colW/2;
        const label=includeDates ? recordDate(item,id) : '✓';
        drawTextFit(ctx,label,x,cy,colW-8,includeDates?16:24,'700');
      }
    });
  }
  return c;
}

function makeMissingCanvas(){
  const W=1240,H=1754;
  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');

  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#111';

  ctx.textAlign='center';
  ctx.font='700 38px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText('未提出者一覧',W/2,70);

  ctx.font='700 28px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText(state.selectedItem||'',W/2,120);

  ctx.font='500 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText(`${state.year}年度　${state.grade}年${state.classNo}組　${state.count}人`,W/2,165);

  const rec=state.records[state.selectedItem]||{};
  const missing=[];
  for(let n=1;n<=state.count;n++){
    if(!rec[studentId(n)]) missing.push(n);
  }

  ctx.textAlign='left';
  ctx.font='700 26px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillText(`未提出：${missing.length}人`,80,245);

  const cardW=210, cardH=80;
  const gapX=18,gapY=18;
  const cols=5;
  const startX=80,startY=300;

  missing.forEach((n,i)=>{
    const col=i%cols;
    const row=Math.floor(i/cols);
    const x=startX+col*(cardW+gapX);
    const y=startY+row*(cardH+gapY);

    ctx.strokeStyle='#777';
    ctx.strokeRect(x,y,cardW,cardH);

    ctx.fillStyle='#111';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillText(`${n}番`,x+cardW/2,y+cardH/2);
  });

  if(!missing.length){
    ctx.textAlign='center';
    ctx.font='700 34px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillText('全員提出済みです',W/2,360);
  }

  return c;
}

async function makeAllPdf(includeDates=false){
  if(!state.items.length){
    alert('提出項目を作成してください。');
    return;
  }

  const maxPerPage=6;
  const pages=[];
  for(let i=0;i<state.items.length;i+=maxPerPage){
    pages.push(state.items.slice(i,i+maxPerPage));
  }

  const canvases=pages.map((items,i)=>makeAllListCanvas(items,i+1,pages.length,includeDates));
  const blob=makePdfBlobFromCanvases(canvases);
  const filename=`${includeDates?'提出日一覧':'提出状況一覧'}_${state.year}_${state.grade}年${state.classNo}組.pdf`;
  await savePdf(blob,filename);
}

async function makeMissingPdf(){
  if(!state.selectedItem){
    alert('提出項目を選択してください。');
    return;
  }
  const canvas=makeMissingCanvas();
  const blob=makePdfBlobFromCanvases([canvas]);
  const safe=state.selectedItem.replace(/[\\/:*?"<>|]/g,'_');
  await savePdf(blob,`未提出者一覧_${safe}_${state.grade}年${state.classNo}組.pdf`);
}

async function exportBackup(){
  const payload={
    app:'submission-check-github',
    version:1,
    exportedAt:new Date().toISOString(),
    data:state
  };
  const text=JSON.stringify(payload,null,2);
  const blob=new Blob([text],{type:'application/json'});
  const filename=`提出チェック_backup_${state.year}_${state.grade}年${state.classNo}組.json`;

  try{
    const file=new File([blob],filename,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});
      document.getElementById('backupStatus').textContent='✅ バックアップを保存しました';
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  document.getElementById('backupStatus').textContent='✅ バックアップを保存しました';
}

function importBackupFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(reader.result);
      if(payload?.app!=='submission-check-github' || !payload.data){
        alert('この提出チェックのバックアップファイルではありません。');
        return;
      }
      if(!confirm('現在のデータを、このバックアップ内容に置き換えますか？')) return;

      state=payload.data;
      if(!state.records)state.records={};
      if(!state.items)state.items=[];
      save();

      document.getElementById('year').value=state.year;
      document.getElementById('count').value=state.count;
      renderAll();
      document.getElementById('backupStatus').textContent='✅ バックアップを復元しました';
      setStatus('✅ バックアップを復元しました','ok');
      focusScan();
    }catch(e){
      alert('バックアップファイルを読み込めませんでした。');
    }
  };
  reader.readAsText(file);
}

document.getElementById('backupFile').addEventListener('change',function(){
  const file=this.files?.[0];
  this.value='';
  importBackupFile(file);
});

function renderItems(){
  const el=document.getElementById('items');el.innerHTML='';
  state.items.forEach(name=>{const b=document.createElement('button');b.className='item-chip'+(name===state.selectedItem?' active':'');b.textContent=name;b.onclick=()=>selectItem(name);el.appendChild(b);});
  const mgr=document.getElementById('itemManager');mgr.innerHTML='';
  state.items.forEach(name=>{const row=document.createElement('div');row.className='row';row.style.margin='7px 0';const t=document.createElement('div');t.style.flex='1';t.style.fontWeight='800';t.textContent=name;const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>deleteItem(name);row.append(t,del);mgr.appendChild(row);});
}
function renderSummary(){
  const el=document.getElementById('summary');el.innerHTML='';
  if(!state.selectedItem)return;
  const rec=state.records[state.selectedItem]||{}, submitted=Object.keys(rec).length;
  el.innerHTML=`<div class="pill">選択中：${state.selectedItem}</div><div class="pill">提出 ${submitted}人</div><div class="pill">未提出 ${state.count-submitted}人</div>`;
}

function recordDate(item,id){
  const iso=state.records[item]?.[id]?.time;
  if(!iso) return '';
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return '';
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function toggleDateView(){
  showDates=!showDates;
  document.getElementById('dateToggleBtn').textContent=
    showDates ? '✓表示に戻す' : '提出日表示';
  renderTable();
}

function renderTable(){
  const t=document.getElementById('table');
  let h='<thead><tr><th>番号</th>';state.items.forEach(i=>h+=`<th>${i}</th>`);h+='</tr></thead><tbody>';
  for(let n=1;n<=state.count;n++){
    const id=studentId(n);h+=`<tr><td>${n}番</td>`;
    state.items.forEach((item,idx)=>{
      const checked=!!state.records[item]?.[id];
      const label=checked ? (showDates ? recordDate(item,id) : '✓') : '';
      h+=`<td>${checked?`<button type="button" class="check-btn" data-item="${idx}" data-id="${id}" data-n="${n}">${label}</button>`:''}</td>`;
    });
    h+='</tr>';
  }
  h+='</tbody>';t.innerHTML=h;
  t.querySelectorAll('.check-btn').forEach(btn=>btn.addEventListener('click',function(){removeCheck(state.items[+this.dataset.item],this.dataset.id,+this.dataset.n);}));
}
function renderAll(){
  renderClassButtons();renderItems();renderSummary();renderTable();
  document.getElementById('selectedItemLabel').textContent='選択中：'+(state.selectedItem||'なし');
}
load();
</script>
</body>
