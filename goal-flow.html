<style>

header{display:flex;gap:12px;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

label.lab{display:block;font-weight:700;font-size:13px;margin:13px 0 5px}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mileedit{display:grid;grid-template-columns:145px 1fr 38px;gap:7px;margin:7px 0}.bottom{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.bulktext{width:100%;min-height:210px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}.hint{font-size:12px;color:var(--muted);line-height:1.6}.candidate{display:grid;grid-template-columns:28px 145px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.candidate input[type=date],.candidate input[type=text]{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px}.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 13px;border-radius:10px;display:none;z-index:3000;font-size:13px}

.tagbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tagbar::-webkit-scrollbar{display:none}

.tagpill.on{background:var(--accent);border-color:var(--accent);color:#fff}.tagpill.add{border-style:dashed}
.cardtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.cardtag{display:inline-flex;align-items:center;gap:4px;background:#eef2f4;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}

@media(max-width:650px){.wrap{padding:14px 12px 85px}header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.stats{margin:13px 0}.toolbar{gap:7px}.panel{border:0;border-radius:0;padding:0}.grid2{grid-template-columns:1fr}.mileedit{grid-template-columns:1fr}.mileedit .del{justify-self:end}.candidate{grid-template-columns:28px 1fr;grid-template-rows:auto auto}.candidate .ck{grid-row:1/3}.candidate .datein{grid-column:2}.candidate .titlein{grid-column:2}.screen{background:#fff}.sticky{background:#fff}.tlrow{grid-template-columns:110px minmax(460px,1fr)}}
.cloudbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.cloudstate{font-size:12px;color:var(--muted);padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:999px}.cloudstate.ok{color:#27613e;background:#edf8f1}.cloudstate.warn{color:#8a5b18;background:#fff7e6}
.calnav{display:flex;justify-content:center;gap:18px;align-items:center;margin:14px 0}.weekhead,.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekhead b{text-align:center;font-size:12px;padding:6px}.calcell{min-height:100px;border:1px solid var(--line);padding:6px;background:#fff;overflow:hidden}.calcell.blank{background:#f7f7f7}.calev,.yearev{font-size:11px;line-height:1.35;margin-top:4px;padding:3px 4px;border-radius:5px;background:#f3f6fb;overflow-wrap:anywhere}.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.monthbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:130px}.monthbox h3{margin:0 0 6px}@media(max-width:700px){.calcell{min-height:74px;padding:3px}.calev{font-size:9px;padding:2px}.yeargrid{grid-template-columns:1fr 1fr}.yearev{font-size:10px}}

  .monthbox{min-height:100px!important;padding:6px!important}
  .calev,.yearev{font-size:9px!important}
}

<body>
<div class="wrap">
<header><div><h1>Goal Flow</h1><div class="sub">ゴールと途中の締切を、ひと目で。</div></div>
<div class="actions"><button class="btn" onclick="openBulk()">✨ ChatGPTから取り込み</button><button class="btn primary" onclick="openEditor()">＋ かんたん登録</button></div></header>
<div class="cloudbar"><button id="loginBtn" class="btn" onclick="googleLogin()">Googleでログイン</button><button id="logoutBtn" class="btn" style="display:none" onclick="googleLogout()">ログアウト</button><span id="cloudState" class="cloudstate">端末内に保存中</span></div>
<div class="stats"><div class="stat"><b id="stActive">0</b><span>進行中</span></div><div class="stat"><b id="stSoon">0</b><span>7稼働日以内</span></div><div class="stat"><b id="stOver">0</b><span>期限超過</span></div></div>
<div class="toolbar"><div class="seg" id="statusSeg"><button class="on" data-v="active">進行中</button><button data-v="done">完了済み</button></div><div class="seg" id="viewSeg"><button class="on" data-v="list">一覧</button><button data-v="timeline">タイムライン</button><button data-v="month">月</button><button data-v="year">年</button></div><button class="btn" id="todayBtn" onclick="goToday()" style="display:none">今日</button><input id="search" class="search" placeholder="検索"><button class="btn" onclick="printCurrent()">🖨 印刷</button><button class="btn" onclick="exportData()">バックアップ</button><label class="btn">復元<input type="file" accept=".json,application/json" hidden onchange="importData(event)"></label><button class="btn" onclick="recoverLocal()">端末内から復元</button></div>
<div id="tagBar" class="tagbar"></div><div id="content"></div>
</div>

<div class="overlay" id="editor"><div class="screen"><div class="panel"><div class="screenhead"><h2 id="editorTitle">かんたん登録</h2><button class="close" onclick="closeEditor()">×</button></div>
<label class="lab">何をする？</label><input id="title" class="field" placeholder="例：研究授業の準備">
<div class="grid2"><div><label class="lab">開始日</label><input id="start" type="date" class="field"></div><div><label class="lab">最終締切</label><input id="final" type="date" class="field"></div></div>
<label class="lab">途中の締切</label><div id="mileEditor"></div><button class="mini" onclick="addMile()">＋ 中間締切を追加</button>
<label class="lab"><input id="weekend" type="checkbox" checked> 残り日数から土日を除外</label>
<label class="lab">タグ</label><div id="editorTags" class="checktags"></div><label class="lab">メモ</label><textarea id="memo" class="field" rows="3"></textarea>
<div class="bottom"><button class="btn" onclick="closeEditor()">キャンセル</button><button class="btn primary" onclick="saveTask()">保存</button></div></div></div></div>

<div class="overlay" id="bulk"><div class="screen"><div class="panel">
<div id="bulkInput"><div class="screenhead"><h2>ChatGPTから取り込み</h2><button class="close" onclick="closeBulk()">×</button></div>
<div class="hint">予定表の写真をChatGPTに送り「Goal Flow用にして」と伝えます。返ってきた文字列をそのまま貼り付けます。<br><b>形式：2026/10/01 | 予定名</b></div>
<textarea id="bulkText" class="bulktext" placeholder="2026/10/01 | 人権（3・4年）&#10;2026/10/01 | あゆみ提出"></textarea>
<div class="bottom"><button class="btn" onclick="pasteText()">📋 貼り付け</button><button class="btn" onclick="closeBulk()">キャンセル</button><button class="btn primary" onclick="parseBulk()">予定を読み取る</button></div></div>
<div id="bulkConfirm" style="display:none"><div class="screenhead"><h2>登録する予定を確認</h2><button class="close" onclick="closeBulk()">×</button></div><div id="candidates"></div><div class="sticky"><button class="btn" onclick="backBulk()">← 入力に戻る</button><button class="btn primary" onclick="commitBulk()">選択した予定を登録</button></div></div>
</div></div></div>
<div class="overlay" id="tagManager"><div class="screen"><div class="panel"><div class="screenhead"><h2>タグと自動分類</h2><button class="close" onclick="closeTags()">×</button></div>
<div class="hint">タグ名と、自動で振り分けたい文言を設定します。キーワードは「WSC, 全体練習」のようにカンマで区切れます。</div>
<div id="tagRows"></div><button class="mini" onclick="newTag()">＋ タグを追加</button>
<div class="bottom"><button class="btn" onclick="closeTags()">閉じる</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBkeQdnLWjDFtY4nfFiEMTgh_HgMGTdVOU",
  authDomain: "goal-flow-dc2b1.firebaseapp.com",
  projectId: "goal-flow-dc2b1",
  storageBucket: "goal-flow-dc2b1.firebasestorage.app",
  messagingSenderId: "209981716989",
  appId: "1:209981716989:web:9fc23f481a1f4fd34d0194"
};
const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp),db=getFirestore(fbApp),provider=new GoogleAuthProvider();
let cloudUser=null,cloudLoading=false,cloudTimer=null;
function cloudEl(){return document.getElementById('cloudState')}
function cloudStatus(s,kind=''){let x=cloudEl();if(!x)return;if(kind==='ok'&&(s.includes('保存')||s.includes('同期')||s.includes('移行')||s.includes('統合')))s+='　'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});x.textContent=s;x.className='cloudstate '+kind}
async function googleLogin(){
 try{
  cloudStatus('Googleログイン中…');
  provider.setCustomParameters({prompt:'select_account'});
  await setPersistence(auth,browserLocalPersistence);
  await signInWithPopup(auth,provider);
 }catch(e){
  console.error('Firebase Google login error',e);
  cloudStatus('ログインできませんでした','warn');
  const code=e&&e.code?e.code:'unknown';
  const msg=e&&e.message?e.message:'';
  alert('Googleログインに失敗しました。\n\nエラー：'+code+'\n'+msg);
 }
}
async function googleLogout(){if(confirm('ログアウトしますか？\n端末内の予定は残ります。'))await signOut(auth)}
window.googleLogin=googleLogin;window.googleLogout=googleLogout;
async function cloudRef(){return cloudUser?doc(db,'users',cloudUser.uid,'goalflow','state'):null}
function mergeById(local,remote){let m=new Map();local.forEach(x=>m.set(x.id,x));remote.forEach(x=>m.set(x.id,x));return [...m.values()]}
function sameData(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}}
async function uploadCloud(){if(!cloudUser||cloudLoading)return;try{cloudStatus('クラウドへ保存中…');let r=await cloudRef();await setDoc(r,{tasks:tasks,tags:tags,updatedAt:serverTimestamp(),updatedAtClient:new Date().toISOString()},{merge:true});cloudStatus('クラウド保存済み','ok')}catch(e){console.error(e);cloudStatus('クラウド保存に失敗','warn')}}
function queueCloud(){if(!cloudUser||cloudLoading)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(uploadCloud,450)}
async function syncFromCloud(user){
 cloudLoading=true;
 try{
  cloudStatus('クラウドと同期中…');
  let r=await cloudRef(),snap=await getDoc(r);
  if(snap.exists()){
   let d=snap.data(),remote=Array.isArray(d.tasks)?d.tasks.map(normalize):[],rtags=Array.isArray(d.tags)?d.tags:[];
   if(!tasks.length&&!tags.length){
    tasks=remote;tags=rtags;
    localStorage.setItem(KEY,JSON.stringify(tasks));
    if(tasks.length)localStorage.setItem(SAFEKEY,JSON.stringify(tasks));
    localStorage.setItem(TAGKEY,JSON.stringify(tags));
    cloudStatus('クラウドから同期しました','ok');
   }else if(!remote.length&&!rtags.length){
    await setDoc(r,{tasks,tags,updatedAt:serverTimestamp(),updatedAtClient:new Date().toISOString()},{merge:true});
    cloudStatus('端末の予定をクラウドへ保存しました','ok');
   }else{
    let mergedTasks=mergeById(tasks,remote).map(normalize);
    let mergedTags=mergeById(tags,rtags);
    let changed=!sameData(mergedTasks,remote)||!sameData(mergedTags,rtags);
    if(changed)snapshot();
    tasks=mergedTasks;tags=mergedTags;
    localStorage.setItem(KEY,JSON.stringify(tasks));
    if(tasks.length)localStorage.setItem(SAFEKEY,JSON.stringify(tasks));
    localStorage.setItem(TAGKEY,JSON.stringify(tags));
    await setDoc(r,{tasks,tags,updatedAt:serverTimestamp(),updatedAtClient:new Date().toISOString()},{merge:true});
    cloudStatus(changed?'端末とクラウドの予定を統合しました':'クラウド同期済み','ok');
   }
  }else{
   await setDoc(r,{tasks,tags,updatedAt:serverTimestamp(),updatedAtClient:new Date().toISOString()});
   cloudStatus(tasks.length?'端末の予定をクラウドへ移行しました':'クラウド保存を開始しました','ok');
  }
 }catch(e){console.error(e);cloudStatus('同期できませんでした','warn')}
 finally{cloudLoading=false;render()}
}
onAuthStateChanged(auth,async user=>{cloudUser=user;document.getElementById('loginBtn').style.display=user?'none':'';document.getElementById('logoutBtn').style.display=user?'':'none';if(user)await syncFromCloud(user);else cloudStatus('端末内に保存中')});

const KEY='goalflow_v1_tasks'; // 永久固定
const SNAP='goalflow_snapshot_';
const TAGKEY='goalflow_tags_v1'; // タグ設定も固定
const SAFEKEY='goalflow_v1_tasks_lastgood'; // 最後に正常だった予定の保護コピー
function load(k){try{let v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)?v:null}catch(e){return null}}
function taskArray(v){return Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&('title' in x||'finalDate' in x||'milestones' in x))}
function initialTasks(){
  let main=load(KEY);
  if(taskArray(main)&&main.length)return main;
  // KEY自体が消失・破損した場合だけ、最後の正常コピーから自動復元する。
  // 明示的に全件削除した [] は尊重し、勝手に復活させない。
  if(main===null){
    let safe=load(SAFEKEY);
    if(taskArray(safe)&&safe.length){try{localStorage.setItem(KEY,JSON.stringify(safe))}catch(e){};return safe}
    let c=[];
    for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith(SNAP)){let v=load(k);if(taskArray(v)&&v.length)c.push({k,v})}}
    c.sort((a,b)=>b.k.localeCompare(a.k));
    if(c[0]){try{localStorage.setItem(KEY,JSON.stringify(c[0].v))}catch(e){};return c[0].v}
  }
  return taskArray(main)?main:[];
}
let tags=load(TAGKEY)||[], tagFilter='all';
let tasks=initialTasks(), status='active', view='list', editing=null, bulkRows=[], calendarDate=new Date();
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(d){return new Date(d+'T00:00:00')} function short(d){if(!d)return'';let a=d.split('-');return (+a[1])+'/'+(+a[2])}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function normalize(t){return {id:t.id||id(),title:t.title||'',startDate:t.startDate||today(),finalDate:t.finalDate||t.startDate||today(),milestones:Array.isArray(t.milestones)?t.milestones.map(m=>({date:m.date||today(),text:m.text||'',done:!!m.done})):[],excludeWeekend:t.excludeWeekend!==false,excludeHolidays:!!t.excludeHolidays,memo:t.memo||'',todayFlag:!!t.todayFlag,completed:!!t.completed,completedAt:t.completedAt||'',createdAt:t.createdAt||new Date().toISOString(),tags:Array.isArray(t.tags)?t.tags:[],excludedTags:Array.isArray(t.excludedTags)?t.excludedTags:[]}}
tasks=tasks.map(normalize);
function snapshot(){try{let v=load(KEY);if(!taskArray(v)||!v.length)return;let raw=JSON.stringify(v);let k=SNAP+new Date().toISOString().replace(/[:.]/g,'-');localStorage.setItem(k,raw);localStorage.setItem(SAFEKEY,raw);let ks=[];for(let i=0;i<localStorage.length;i++){let x=localStorage.key(i);if(x&&x.startsWith(SNAP))ks.push(x)}ks.sort().reverse().slice(20).forEach(x=>localStorage.removeItem(x))}catch(e){}}
function save(){snapshot();localStorage.setItem(KEY,JSON.stringify(tasks));if(tasks.length)localStorage.setItem(SAFEKEY,JSON.stringify(tasks));localStorage.setItem(TAGKEY,JSON.stringify(tags));render();queueCloud()}
function autoTag(t){
 tags.forEach(g=>{
   if(t.excludedTags.includes(g.id))return;
   let hay=(t.title+' '+t.memo+' '+t.milestones.map(m=>m.text).join(' ')).toLowerCase();
   if(g.keys.some(k=>k.trim()&&hay.includes(k.trim().toLowerCase()))&&!t.tags.includes(g.id))t.tags.push(g.id);
 });
 return t;
}
function tagName(x){let g=tags.find(t=>t.id===x);return g?g.name:''}
function removeTag(taskId,tagId){let t=tasks.find(x=>x.id===taskId);if(!t)return;t.tags=t.tags.filter(x=>x!==tagId);if(!t.excludedTags.includes(tagId))t.excludedTags.push(tagId);save()}
function toggleTaskTag(taskId,tagId,on){let t=tasks.find(x=>x.id===taskId);if(!t)return;if(on){if(!t.tags.includes(tagId))t.tags.push(tagId);t.excludedTags=t.excludedTags.filter(x=>x!==tagId);save()}else removeTag(taskId,tagId)}
function renderTagBar(){el('tagBar').innerHTML=`<button class="tagpill ${tagFilter==='all'?'on':''}" onclick="setTag('all')">すべて</button><button class="tagpill ${tagFilter==='today'?'on':''}" onclick="setTag('today')">★ 今日やる</button>`+tags.map(g=>`<button class="tagpill ${tagFilter===g.id?'on':''}" onclick="setTag('${g.id}')">${esc(g.name)}</button>`).join('')+`<button class="tagpill add" onclick="openTags()">＋タグ</button>`}
function setTag(x){tagFilter=x;render()}
function openTags(){renderTagRows();el('tagManager').classList.add('show')}
function closeTags(){el('tagManager').classList.remove('show')}
function renderTagRows(){el('tagRows').innerHTML=tags.map(g=>`<div class="tagrow"><div class="tagrowtop"><input class="field" value="${esc(g.name)}" onchange="editTag('${g.id}','name',this.value)"><button class="mini" onclick="deleteTag('${g.id}')">削除</button></div><label class="lab">自動分類キーワード</label><input class="field" value="${esc(g.keys.join(', '))}" onchange="editTag('${g.id}','keys',this.value)"><div class="tagkeys">一致した予定に自動でこのタグを付けます。</div></div>`).join('')||'<div class="hint">タグはまだありません。</div>'}
function newTag(){let name=prompt('タグ名を入力してください。例：WSC');if(!name)return;let keys=prompt('自動分類するキーワードをカンマ区切りで入力してください。',name)||'';tags.push({id:'t'+Date.now().toString(36),name:name.trim(),keys:keys.split(',').map(x=>x.trim()).filter(Boolean)});tasks.forEach(autoTag);save();renderTagRows()}
function editTag(x,field,val){let g=tags.find(a=>a.id===x);if(!g)return;if(field==='name')g.name=val.trim();else g.keys=val.split(',').map(x=>x.trim()).filter(Boolean);tasks.forEach(autoTag);save();renderTagRows()}
function deleteTag(x){let g=tags.find(a=>a.id===x);if(!g||!confirm('「'+g.name+'」タグを削除しますか？\n予定そのものは削除されません。'))return;tags=tags.filter(a=>a.id!==x);tasks.forEach(t=>{t.tags=t.tags.filter(a=>a!==x);t.excludedTags=t.excludedTags.filter(a=>a!==x)});if(tagFilter===x)tagFilter='all';save();renderTagRows()}
function workdays(a,b,t){let x=parse(a),y=parse(b),sg=x<=y?1:-1;if(sg<0)[x,y]=[y,x];let n=0,d=new Date(x);while(d<y){d.setDate(d.getDate()+1);let w=d.getDay();if(!(t.excludeWeekend&&(w===0||w===6)))n++}return n*sg}
function next(t){let m=t.milestones.filter(x=>!x.done).slice().sort((a,b)=>a.date.localeCompare(b.date));return m[0]||{date:t.finalDate,text:'最終ゴール'}}
function remain(t,d){return workdays(today(),d,t)}
function el(x){return document.getElementById(x)}
function render(){renderTagBar();let tb=el('todayBtn');if(tb)tb.style.display=(view==='month'||view==='year')?'':'none';let active=tasks.filter(t=>!t.completed);el('stActive').textContent=active.length;el('stSoon').textContent=active.filter(t=>{let r=remain(t,next(t).date);return r>=0&&r<=7}).length;el('stOver').textContent=active.filter(t=>remain(t,next(t).date)<0).length;
let q=el('search').value.trim().toLowerCase();let arr=tasks.filter(t=>status==='done'?t.completed:!t.completed).filter(t=>tagFilter==='all'||(tagFilter==='today'?t.todayFlag:t.tags.includes(tagFilter))).filter(t=>!q||(t.title+' '+t.memo+' '+t.milestones.map(m=>m.text).join(' ')).toLowerCase().includes(q));arr.sort((a,b)=>status==='done'?(b.completedAt||'').localeCompare(a.completedAt||''):((b.todayFlag?1:0)-(a.todayFlag?1:0)||next(a).date.localeCompare(next(b).date)));
el('content').innerHTML=!arr.length?'<div class="empty"><b>'+(status==='done'?'完了済みはまだありません':'進行中の予定はありません')+'</b></div>':view==='list'?'<div class="list">'+arr.map(card).join(''):view==='timeline'?timeline(arr):view==='month'?monthView(arr):yearView(arr)}
function calMove(n){if(view==='month')calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+n,1);else calendarDate=new Date(calendarDate.getFullYear()+n,calendarDate.getMonth(),1);render()}
function goToday(){calendarDate=new Date();render()}
function monthView(arr){let y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),cells='',lead=first.getDay();for(let i=0;i<lead;i++)cells+='<div class="calcell blank"></div>';for(let d=1;d<=last.getDate();d++){let ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=[];arr.forEach(t=>{t.milestones.forEach(x=>{if(x.date===ds)ev.push('◆ '+x.text)});if(t.finalDate===ds)ev.push('★ '+t.title)});cells+='<div class="calcell"><b>'+d+'</b>'+ev.map(x=>'<div class="calev">'+esc(x)+'</div>').join('')+'</div>'}return '<div class="calnav"><button class="mini" onclick="calMove(-1)">‹ 前月</button><strong>'+y+'年 '+(m+1)+'月</strong><button class="mini" onclick="calMove(1)">次月 ›</button></div><div class="weekhead">'+['日','月','火','水','木','金','土'].map(x=>'<b>'+x+'</b>').join('')+'</div><div class="calgrid">'+cells+'</div>'}
function yearView(arr){let y=calendarDate.getFullYear();return '<div class="calnav"><button class="mini" onclick="calMove(-1)">‹ 前年</button><strong>'+y+'年</strong><button class="mini" onclick="calMove(1)">翌年 ›</button></div><div class="yeargrid">'+Array.from({length:12},(_,m)=>{let ev=[];arr.forEach(t=>{t.milestones.forEach(x=>{if(x.date.startsWith(y+'-'+String(m+1).padStart(2,'0')))ev.push(short(x.date)+' ◆ '+x.text)});if(t.finalDate.startsWith(y+'-'+String(m+1).padStart(2,'0')))ev.push(short(t.finalDate)+' ★ '+t.title)});return '<div class="monthbox"><h3>'+(m+1)+'月</h3>'+ev.map(x=>'<div class="yearev">'+esc(x)+'</div>').join('')+'</div>'}).join('')+'</div>'}
function card(t){let n=next(t),r=remain(t,n.date),all=t.milestones.length+1,done=t.milestones.filter(m=>m.done).length+(t.completed?1:0),pct=Math.round(done/all*100),ct=t.completed?'✓ 完了':r<0?'期限超過 '+Math.abs(r)+'日':r===0?'今日':'あと'+r+'稼働日';
return `<div class="card"><div class="head"><button class="star ${t.todayFlag?'on':''}" onclick="toggleToday('${t.id}')">★</button><div class="grow"><div class="title">${esc(t.title)}</div><div class="meta">開始 ${short(t.startDate)} ・ 最終 ${short(t.finalDate)}</div></div><div class="count ${r<0?'bad':''}">${ct}</div></div>${!t.completed?`<div class="next"><b>次 →</b> ${short(n.date)}　${esc(n.text)}</div>`:''}<div class="miles">${t.milestones.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<label class="mile ${m.done?'done':''}"><input type="checkbox" ${m.done?'checked':''} onchange="toggleMile('${t.id}','${m.date}',${JSON.stringify(m.text).replace(/"/g,'&quot;')})"><span>${short(m.date)}</span><span>${esc(m.text)}</span></label>`).join('')}</div>${t.tags.length?`<div class="cardtags">${t.tags.map(x=>tagName(x)?`<span class="cardtag">${esc(tagName(x))}<button title="この分類から外す" onclick="removeTag(\'${t.id}\',\'${x}\')">×</button></span>`:``).join('')}</div>`:``}<div class="progress"><i style="width:${pct}%"></i></div><div class="foot">進捗 ${pct}% ${t.memo?'・ '+esc(t.memo):''}</div><div class="cardbuttons"><button class="mini" onclick="openEditor('${t.id}')">編集</button><button class="mini" onclick="completeTask('${t.id}')">${t.completed?'進行中に戻す':'完了'}</button><button class="mini" onclick="duplicateTask('${t.id}')">複製</button><button class="mini" onclick="deleteTask('${t.id}')">削除</button></div></div>`}
function timeline(arr){let ds=[];arr.forEach(t=>ds.push(t.startDate,t.finalDate,...t.milestones.map(m=>m.date)));ds.sort();let min=parse(ds[0]),max=parse(ds.at(-1)),span=Math.max(1,(max-min)/86400000),pos=d=>Math.max(0,Math.min(100,(parse(d)-min)/86400000/span*100));return '<div class="timeline">'+arr.map(t=>`<div class="tlrow"><div class="tlname">${esc(t.title)}<div class="meta">次 ${short(next(t).date)}</div></div><div class="track">${t.milestones.map(m=>`<span class="dot" style="left:${pos(m.date)}%" title="${esc(m.text)}">◆ <b>${esc(m.text)}</b></span>`).join('')}<span class="dot" style="left:${pos(t.finalDate)}%" title="最終ゴール">★ <b>最終ゴール</b></span></div></div>`).join('')+'</div>'}
function openEditor(x){editing=x||null;let t=tasks.find(a=>a.id===x);editorTitle.textContent=t?'予定を編集':'かんたん登録';title.value=t?t.title:'';start.value=t?t.startDate:today();final.value=t?t.finalDate:'';weekend.checked=t?t.excludeWeekend:true;memo.value=t?t.memo:'';editorTags.innerHTML=tags.map(g=>`<label class="checktag"><input type="checkbox" data-tag="${g.id}" ${t&&t.tags.includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('');mileEditor.innerHTML='';(t&&t.milestones.length?t.milestones:[null]).forEach(addMile);editor.classList.add('show')}
function closeEditor(){editor.classList.remove('show')}
function addMile(m){let d=document.createElement('div');d.className='mileedit';d.innerHTML=`<input class="field md" type="date" value="${m?m.date:''}"><input class="field mt" placeholder="例：資料完成" value="${m?esc(m.text):''}"><button class="mini del" onclick="this.parentElement.remove()">×</button>`;mileEditor.appendChild(d)}
function saveTask(){if(!title.value.trim()||!start.value||!final.value){alert('タイトル・開始日・最終締切を入力してください。');return}let ms=[...mileEditor.querySelectorAll('.mileedit')].map(r=>({date:r.querySelector('.md').value,text:r.querySelector('.mt').value.trim(),done:false})).filter(m=>m.date&&m.text);let chosen=[...editorTags.querySelectorAll('input[data-tag]:checked')].map(x=>x.dataset.tag);let old=tasks.find(t=>t.id===editing);if(old){ms.forEach(m=>{let p=old.milestones.find(x=>x.date===m.date&&x.text===m.text);if(p)m.done=p.done});let removed=old.tags.filter(x=>!chosen.includes(x));let added=chosen.filter(x=>!old.tags.includes(x));let excluded=[...new Set([...(old.excludedTags||[]),...removed])].filter(x=>!added.includes(x));Object.assign(old,{title:title.value.trim(),startDate:start.value,finalDate:final.value,milestones:ms,excludeWeekend:weekend.checked,memo:memo.value.trim(),tags:chosen,excludedTags:excluded});autoTag(old)}else tasks.push(autoTag(normalize({title:title.value.trim(),startDate:start.value,finalDate:final.value,milestones:ms,excludeWeekend:weekend.checked,memo:memo.value.trim(),tags:chosen})));closeEditor();save()}
function toggleToday(x){let t=tasks.find(a=>a.id===x);t.todayFlag=!t.todayFlag;save()} function toggleMile(x,d,tx){let t=tasks.find(a=>a.id===x),m=t.milestones.find(a=>a.date===d&&a.text===tx);if(m)m.done=!m.done;save()}
function completeTask(x){let t=tasks.find(a=>a.id===x);t.completed=!t.completed;t.completedAt=t.completed?new Date().toISOString():'';save()} function duplicateTask(x){let t=JSON.parse(JSON.stringify(tasks.find(a=>a.id===x)));t.id=id();t.title+='（コピー）';t.completed=false;t.completedAt='';t.milestones.forEach(m=>m.done=false);tasks.push(t);save()}
function deleteTask(x){if(confirm('この予定を削除しますか？')){tasks=tasks.filter(a=>a.id!==x);save()}}
function openBulk(){el('bulkInput').style.display='block';el('bulkConfirm').style.display='none';el('bulkText').value='';el('bulk').classList.add('show')} function closeBulk(){el('bulk').classList.remove('show')} function backBulk(){el('bulkInput').style.display='block';el('bulkConfirm').style.display='none'}
async function pasteText(){let box=el('bulkText');try{if(!navigator.clipboard||!navigator.clipboard.readText)throw 0;box.value=await navigator.clipboard.readText()}catch(e){box.focus();alert('iPhoneでは入力欄を長押しして「ペースト」を選んでください。')}}
function parseBulk(){let lines=el('bulkText').value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);bulkRows=[];for(let l of lines){let m=l.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})\s*(?:\||｜|:|：|\t)\s*(.+)$/);if(m)bulkRows.push({date:m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'),title:m[4].trim(),use:true})}if(!bulkRows.length){alert('予定を読み取れませんでした。「2026/10/01 | 予定名」の形式を確認してください。');return}el('candidates').innerHTML=bulkRows.map((r,i)=>`<div class="candidate"><input class="ck" type="checkbox" checked onchange="bulkRows[${i}].use=this.checked"><input class="datein" type="date" value="${r.date}" onchange="bulkRows[${i}].date=this.value"><input class="titlein" value="${esc(r.title)}" onchange="bulkRows[${i}].title=this.value"></div>`).join('');el('bulkInput').style.display='none';el('bulkConfirm').style.display='block';el('bulk').querySelector('.screen').scrollTop=0}
function commitBulk(){let a=bulkRows.filter(r=>r.use&&r.date&&r.title.trim());a.forEach(r=>tasks.push(autoTag(normalize({title:r.title.trim(),startDate:today(),finalDate:r.date,memo:'ChatGPTから取り込み'}))));closeBulk();save();toastMsg(a.length+'件登録しました')}
function printCurrent(){window.print()}
function exportData(){let b=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='goalflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('現在のデータをこのバックアップで置き換えますか？')){snapshot();tasks=d.map(normalize).map(autoTag);save()}}catch{alert('バックアップを読み込めませんでした。')}};r.readAsText(f);e.target.value=''}
function recoverLocal(){let c=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!(k===KEY||k===SAFEKEY||k.startsWith(SNAP)))continue;let v=load(k);if(taskArray(v)&&v.length)c.push({k,v})}c.sort((a,b)=>{if(a.k===SAFEKEY)return-1;if(b.k===SAFEKEY)return 1;return b.k.localeCompare(a.k)});if(!c.length){alert('このURLの端末内に復元できる予定データはありません。');return}let msg=c.slice(0,10).map((x,i)=>(i+1)+'：'+x.v.length+'件　'+(x.k===SAFEKEY?'保護コピー':x.k===KEY?'現在のデータ':'自動バックアップ')).join('\n'),n=prompt('復元候補の番号を入力してください。\n\n'+msg,'1'),x=c[+n-1];if(x&&confirm(x.v.length+'件を復元しますか？')){snapshot();tasks=x.v.map(normalize);localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(SAFEKEY,JSON.stringify(tasks));render();toastMsg('予定を復元しました')}}
function toastMsg(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}
el('statusSeg').onclick=e=>{if(e.target.dataset.v){status=e.target.dataset.v;[...statusSeg.children].forEach(b=>b.classList.toggle('on',b.dataset.v===status));render()}};el('viewSeg').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;[...viewSeg.children].forEach(b=>b.classList.toggle('on',b.dataset.v===view));render()}};el('search').oninput=render;

// module内の関数をHTMLボタンから呼べるように公開
Object.assign(window,{
  setTag,calMove,goToday,openTags,closeTags,newTag,editTag,deleteTag,removeTag,toggleTaskTag,
  openEditor,closeEditor,addMile,saveTask,toggleToday,toggleMile,
  completeTask,duplicateTask,deleteTask,
  openBulk,closeBulk,backBulk,pasteText,parseBulk,commitBulk,
  printCurrent,exportData,importData,recoverLocal
});
snapshot();render();
</script>
</body></html>
