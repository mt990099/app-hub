<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f8fb">
<title>Goal Flow v1.2</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#25282d;--muted:#727780;--line:#e5e7eb;--accent:#52667a;--soft:#eef2f5;--danger:#b94a48;--warn:#b57925;--ok:#47765c;--shadow:0 8px 24px rgba(20,28,38,.07)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh;padding:18px 16px 100px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.brand h1{font-size:25px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.add{border:0;background:var(--ink);color:white;border-radius:14px;padding:11px 15px;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.seg{display:flex;background:#e9ebee;border-radius:12px;padding:3px}.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;color:#5d626a}.seg button.active{background:white;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.08);font-weight:700}.spacer{flex:1}.smallbtn{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:10px;color:#555}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.sum{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}.sum b{font-size:22px}.sum span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.list{display:flex;flex-direction:column;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.card.overdue{border-left:5px solid var(--danger)}.card.urgent{border-left:5px solid var(--warn)}.cardhead{display:flex;gap:10px;align-items:flex-start}.title{font-weight:800;font-size:17px;line-height:1.35}.meta{font-size:12px;color:var(--muted);margin-top:4px}.grow{flex:1}.count{font-weight:800;white-space:nowrap;font-size:13px;padding:6px 9px;border-radius:999px;background:var(--soft)}.count.red{color:var(--danger);background:#fbeeee}.count.orange{color:#98651e;background:#fff4df}.count.green{color:var(--ok);background:#edf7f0}.menu{border:0;background:transparent;font-size:22px;line-height:1;padding:2px 4px;color:#777}
.next{margin-top:12px;padding:10px 11px;background:#f7f8fa;border-radius:12px;font-size:14px}.next b{margin-right:6px}.milestones{margin-top:10px;display:flex;flex-direction:column;gap:7px}.mile{display:flex;gap:9px;align-items:center;font-size:13px}.mile input{width:18px;height:18px}.mile.done .mtxt{text-decoration:line-through;color:#999}.date{width:62px;color:#666;font-variant-numeric:tabular-nums}.mtxt{flex:1}.badge{font-size:11px;color:#777}.progress{height:7px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#6e8294}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;color:#777;font-size:12px}
.empty{text-align:center;padding:55px 15px;color:#777;background:white;border:1px dashed #d7d9dd;border-radius:18px}.empty b{display:block;color:#444;font-size:18px;margin-bottom:6px}
.timeline{overflow:auto;background:white;border:1px solid var(--line);border-radius:17px;padding:14px}.tlrow{display:grid;grid-template-columns:190px minmax(680px,1fr);gap:12px;align-items:center;min-height:60px;border-bottom:1px solid #f0f1f3}.tlrow:last-child{border-bottom:0}.tlname{font-size:13px;font-weight:700}.track{height:38px;position:relative;background:repeating-linear-gradient(to right,#f7f8fa 0,#f7f8fa calc(7.14% - 1px),#e9ebee calc(7.14% - 1px),#e9ebee 7.14%);border-radius:8px}.dot{position:absolute;top:8px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;border:2px solid white;background:#71879b;box-shadow:0 1px 5px rgba(0,0,0,.18);font-size:10px;color:white;display:grid;place-items:center}.dot.final{background:#333}.dot.done{background:#9ca3aa}.todayline{position:absolute;top:0;bottom:0;width:2px;background:#c26565;opacity:.7}
.modalback{position:fixed;inset:0;background:rgba(22,25,30,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}.modalback.show{display:flex}.modal{background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.14)}.modal h2{margin:0 0 5px;font-size:21px}.hint{font-size:12px;color:#777;margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d8dbe0;border-radius:11px;padding:11px;background:white}.field textarea{min-height:90px;resize:vertical}.mileedit{display:grid;grid-template-columns:1fr 150px 42px;gap:7px;margin:7px 0}.mileedit input{min-width:0}.mileedit button{border:0;background:#f4eaea;color:#9a3f3d;border-radius:10px;font-size:18px}.addmile{border:1px dashed #bcc3ca;background:#f8f9fa;border-radius:11px;padding:9px 12px;width:100%;color:#4f5f6e}.search{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;min-width:170px}.todaystar{border:0;background:transparent;font-size:20px;padding:0 5px}.todaystar.on{color:#c58a18}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.actions button{border:0;border-radius:11px;padding:10px 14px}.cancel{background:#eceef1}.save{background:#25282d;color:white;font-weight:700}.danger{background:#f9eaea!important;color:#a23d3b!important}.sheet{position:fixed;z-index:30;display:none;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 35px rgba(0,0,0,.16);padding:6px;min-width:155px}.sheet.show{display:block}.sheet button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px 10px;border-radius:8px}.sheet button:hover{background:#f4f5f6}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#25282d;color:white;border-radius:12px;padding:10px 13px;display:none;z-index:50;font-size:13px}.toast.show{display:block}.toast button{border:0;background:transparent;color:#d9e6ff;font-weight:700;margin-left:10px}
@media(max-width:650px){.app{padding:14px 12px 90px}.brand h1{font-size:22px}.brand p{display:none}.summary{grid-template-columns:repeat(3,1fr)}.sum{padding:10px}.sum b{font-size:18px}.toolbar .spacer{display:none}.row2{grid-template-columns:1fr}.card{padding:13px}.tlrow{grid-template-columns:135px 680px}.timeline{padding:10px}.add{padding:10px 12px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><h1>Goal Flow</h1><p>ゴールと途中の締切を、ひと目で。</p></div><button class="add" id="quickAddBtn" type="button">＋ かんたん登録</button></header>
<div class="toolbar">
 <div class="seg" id="statusSeg"><button data-status="active" class="active">進行中</button><button data-status="done">完了済み</button></div>
 <div class="seg" id="viewSeg"><button data-view="list" class="active">縦一覧</button><button data-view="timeline">横タイムライン</button></div>
 <div class="spacer"></div><input id="searchBox" class="search" placeholder="予定を検索"><button class="smallbtn" onclick="exportData()">バックアップ</button><label class="smallbtn" style="cursor:pointer">復元<input type="file" accept="application/json" onchange="importData(event)" hidden></label>
</div>
<div class="summary"><div class="sum"><b id="s1">0</b><span>進行中</span></div><div class="sum"><b id="s2">0</b><span>7日以内の締切</span></div><div class="sum"><b id="s3">0</b><span>期限超過</span></div></div>
<div id="content"></div>
</div>
<div class="modalback" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal">
<h2 id="modalTitle">かんたん登録</h2><p class="hint">途中の締切は、内容と日付をカレンダーから選ぶだけです。</p>
<div class="field"><label>何をする？</label><input id="taskTitle" placeholder="例：6年 家庭科の授業準備"></div>
<div class="row2"><div class="field"><label>開始日</label><input id="startDate" type="date"></div><div class="field"><label>最終締切</label><input id="finalDate" type="date"></div></div>
<div class="field"><label>途中の締切</label><div id="milestoneEditor"></div><button type="button" class="addmile" onclick="addMilestoneRow()">＋ 途中の締切を追加</button></div>
<div class="field"><label>日数の数え方</label><div class="checks"><label><input type="checkbox" id="excludeWeekend" checked> 土日を数えない</label><label><input type="checkbox" id="excludeHolidays"> 祝日も数えない（簡易）</label></div></div>
<div class="field"><label>メモ（任意）</label><input id="memo" placeholder="資料の場所、リンクのメモなど"></div>
<div class="actions"><button class="cancel" onclick="closeModal()">キャンセル</button><button class="save" onclick="saveTask()">登録する</button></div>
</div></div>
<div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
<script>
const KEY='goalflow_v1_tasks'; let tasks=[]; try{const raw=localStorage.getItem(KEY); tasks=raw?JSON.parse(raw):[]; if(!Array.isArray(tasks)) tasks=[];}catch(e){tasks=[];} let status='active', view='list', editing=null, deleted=null;
const jpHolidays=['2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23'];
function today(){let d=new Date(); return fmt(d)} function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')} function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)} function short(s){let d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}
function workdays(from,to,t){let a=parse(from),b=parse(to),sign=a<=b?1:-1,n=0; if(sign<0){[a,b]=[b,a]} let d=new Date(a); while(d<b){d.setDate(d.getDate()+1);let ds=fmt(d),day=d.getDay(); if(!(t.excludeWeekend&&(day===0||day===6)) && !(t.excludeHolidays&&jpHolidays.includes(ds)))n++} return n*sign}
function nextMilestone(t){let pending=t.milestones.filter(m=>!m.done).sort((a,b)=>a.date.localeCompare(b.date)); if(pending.length)return {...pending[0],final:false}; return {date:t.finalDate,text:'最終ゴール',done:false,final:true}}
function remaining(t,date){return workdays(today(),date,t)}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function render(){document.querySelectorAll('#statusSeg button').forEach(b=>b.classList.toggle('active',b.dataset.status===status));document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); let active=tasks.filter(t=>!t.completed);document.getElementById('s1').textContent=active.length;document.getElementById('s2').textContent=active.filter(t=>{let r=remaining(t,nextMilestone(t).date);return r>=0&&r<=7}).length;document.getElementById('s3').textContent=active.filter(t=>remaining(t,nextMilestone(t).date)<0).length;
 let q=(document.getElementById('searchBox').value||'').trim().toLowerCase(); let arr=tasks.filter(t=>status==='done'?t.completed:!t.completed).filter(t=>!q||(t.title+' '+(t.memo||'')+' '+t.milestones.map(m=>m.text).join(' ')).toLowerCase().includes(q)); arr.sort((a,b)=>status==='done'?(b.completedAt||'').localeCompare(a.completedAt||''):((b.todayFlag?1:0)-(a.todayFlag?1:0)||nextMilestone(a).date.localeCompare(nextMilestone(b).date))); let c=document.getElementById('content'); if(!arr.length){c.innerHTML='<div class="empty"><b>'+(status==='done'?'完了済みはまだありません':'進行中の予定はありません')+'</b>'+(status==='done'?'完了した予定はここに残ります。':'「＋ かんたん登録」から始められます。')+'</div>';return} c.innerHTML=view==='list'?'<div class="list">'+arr.map(cardHTML).join('')+'</div>':timelineHTML(arr)}
function cardHTML(t){let n=nextMilestone(t),r=remaining(t,n.date),cls=r<0?'red':r<=3?'orange':'green',txt=r<0?'期限超過 '+Math.abs(r)+'日':r===0?'今日':`あと${r}稼働日`; let all=t.milestones.length+1,done=t.milestones.filter(m=>m.done).length+(t.completed?1:0),pct=Math.round(done/all*100);return `<div class="card ${r<0?'overdue':r<=3?'urgent':''}"><div class="cardhead"><button class="todaystar ${t.todayFlag?'on':''}" title="今日やる" onclick="toggleToday('${t.id}')">★</button><div class="grow"><div class="title">${esc(t.title)}</div><div class="meta">開始 ${short(t.startDate)} ・ 最終 ${short(t.finalDate)}${t.excludeWeekend?' ・ 土日除外':''}</div></div><div class="count ${cls}">${t.completed?'✓ 完了':txt}</div><button class="menu" onclick="openMenu(event,'${t.id}')">⋯</button></div>${!t.completed?`<div class="next"><b>次 →</b>${short(n.date)}　${esc(n.text)}</div>`:''}<div class="milestones">${t.milestones.sort((a,b)=>a.date.localeCompare(b.date)).map((m,i)=>`<label class="mile ${m.done?'done':''}"><input type="checkbox" ${m.done?'checked':''} onchange="toggleMile('${t.id}',${i})"><span class="date">${short(m.date)}</span><span class="mtxt">${esc(m.text)}</span><span class="badge">${m.done?'完了':mileCount(t,m.date)}</span></label>`).join('')}<div class="mile ${t.completed?'done':''}"><span style="width:18px;text-align:center">★</span><span class="date">${short(t.finalDate)}</span><span class="mtxt">最終ゴール</span></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="foot"><span>進捗 ${pct}%</span><span>${t.memo?esc(t.memo):''}</span></div></div>`}
function mileCount(t,d){let r=remaining(t,d);return r<0?`超過${Math.abs(r)}日`:r===0?'今日':`あと${r}日`}
function timelineHTML(arr){let dates=[];arr.forEach(t=>{dates.push(t.startDate,t.finalDate,...t.milestones.map(m=>m.date))});let min=parse(dates.sort()[0]),max=parse(dates.sort()[dates.length-1]);let span=Math.max(1,(max-min)/86400000);function pos(ds){return Math.max(0,Math.min(100,(parse(ds)-min)/86400000/span*100))}let tp=pos(today());return `<div class="timeline"><div style="font-size:12px;color:#777;margin:0 0 8px 202px">${short(fmt(min))} ───────────────────────── ${short(fmt(max))}</div>${arr.map(t=>`<div class="tlrow"><div class="tlname">${esc(t.title)}<div style="font-weight:400;color:#888;margin-top:3px">次 ${short(nextMilestone(t).date)}</div></div><div class="track">${tp>=0&&tp<=100?`<i class="todayline" style="left:${tp}%"></i>`:''}${t.milestones.map(m=>`<i class="dot ${m.done?'done':''}" title="${esc(m.text)} ${m.date}" style="left:${pos(m.date)}%">◆</i>`).join('')}<i class="dot final" title="最終ゴール ${t.finalDate}" style="left:${pos(t.finalDate)}%">★</i></div></div>`).join('')}</div>`}
function addMilestoneRow(data){var box=document.getElementById('milestoneEditor'),row=document.createElement('div');row.className='mileedit';row.innerHTML='<input class="mileText" placeholder="例：ワークシート完成"><input class="mileDate" type="date"><button type="button" title="削除">×</button>'; if(data){row.querySelector('.mileText').value=data.text||'';row.querySelector('.mileDate').value=data.date||'';row.dataset.done=data.done?'1':'0'} row.querySelector('button').onclick=function(){row.remove()};box.appendChild(row)}
function openModal(id){editing=id||null;var t=tasks.find(function(x){return x.id===editing;});document.getElementById('modalTitle').textContent=t?'予定を編集':'かんたん登録';document.getElementById('taskTitle').value=t?t.title:'';document.getElementById('startDate').value=t?t.startDate:today();document.getElementById('finalDate').value=t?t.finalDate:'';var ed=document.getElementById('milestoneEditor');ed.innerHTML='';if(t&&t.milestones.length){t.milestones.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(addMilestoneRow)}else addMilestoneRow();document.getElementById('excludeWeekend').checked=t?!!t.excludeWeekend:true;document.getElementById('excludeHolidays').checked=t?!!t.excludeHolidays:false;document.getElementById('memo').value=t?(t.memo||''):'';document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show');editing=null}
function collectMilestones(){var rows=[].slice.call(document.querySelectorAll('#milestoneEditor .mileedit')),out=[];rows.forEach(function(r){var text=r.querySelector('.mileText').value.trim(),date=r.querySelector('.mileDate').value;if(text&&date)out.push({text:text,date:date,done:r.dataset.done==='1'})});return out.sort(function(a,b){return a.date.localeCompare(b.date)})}
function saveTask(){var title=document.getElementById('taskTitle').value.trim(),startDate=document.getElementById('startDate').value,finalDate=document.getElementById('finalDate').value;if(!title||!startDate||!finalDate){alert('「何をする？」「開始日」「最終締切」を入力してください。');return}var old=tasks.find(function(t){return t.id===editing}),ms=collectMilestones();if(ms.some(function(m){return m.date>finalDate})){alert('途中の締切は最終締切以前の日付にしてください。');return}if(old){ms.forEach(function(m){var prev=old.milestones.find(function(p){return p.date===m.date&&p.text===m.text});if(prev)m.done=prev.done});Object.assign(old,{title:title,startDate:startDate,finalDate:finalDate,milestones:ms,excludeWeekend:document.getElementById('excludeWeekend').checked,excludeHolidays:document.getElementById('excludeHolidays').checked,memo:document.getElementById('memo').value.trim()})}else tasks.push({id:makeId(),title:title,startDate:startDate,finalDate:finalDate,milestones:ms,excludeWeekend:document.getElementById('excludeWeekend').checked,excludeHolidays:document.getElementById('excludeHolidays').checked,memo:document.getElementById('memo').value.trim(),todayFlag:false,completed:false,createdAt:new Date().toISOString()});closeModal();save()}
function toggleMile(id,index){let t=tasks.find(x=>x.id===id);t.milestones.sort((a,b)=>a.date.localeCompare(b.date));t.milestones[index].done=!t.milestones[index].done;save()}
function toggleToday(id){var t=tasks.find(function(x){return x.id===id});t.todayFlag=!t.todayFlag;save()}
function openMenu(e,id){e.stopPropagation();let t=tasks.find(x=>x.id===id),s=document.getElementById('sheet');s.innerHTML=`<button onclick="completeTask('${id}')">${t.completed?'↩ 進行中に戻す':'✓ 完了にする'}</button><button onclick="openModal('${id}');closeMenu()">編集</button><button onclick="duplicateTask('${id}')">複製</button><button style="color:#a23d3b" onclick="deleteTask('${id}')">削除</button>`;let r=e.currentTarget.getBoundingClientRect();s.style.top=Math.min(innerHeight-190,r.bottom+5)+'px';s.style.left=Math.max(8,Math.min(innerWidth-165,r.right-155))+'px';s.classList.add('show')}
function closeMenu(){document.getElementById('sheet').classList.remove('show')} document.addEventListener('click',closeMenu)
function completeTask(id){let t=tasks.find(x=>x.id===id);t.completed=!t.completed;t.completedAt=t.completed?new Date().toISOString():null;closeMenu();save()}
function duplicateTask(id){let t=tasks.find(x=>x.id===id),c=JSON.parse(JSON.stringify(t));c.id=makeId();c.title+='（コピー）';c.completed=false;c.completedAt=null;c.milestones.forEach(m=>m.done=false);tasks.push(c);closeMenu();save();toast('複製しました')}
function deleteTask(id){let i=tasks.findIndex(x=>x.id===id);deleted={task:tasks[i],index:i};tasks.splice(i,1);closeMenu();save();toast('削除しました',true)}
function toast(msg,undo=false){let el=document.getElementById('toast');el.innerHTML=msg+(undo?'<button onclick="undoDelete()">元に戻す</button>':'');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4500)} function undoDelete(){if(deleted){tasks.splice(deleted.index,0,deleted.task);deleted=null;save();document.getElementById('toast').classList.remove('show')}}
function exportData(){let blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='goalflow-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('現在のデータをバックアップ内容で置き換えますか？')){tasks=d;save();toast('復元しました')}}catch{alert('バックアップファイルを読み込めませんでした。')}};r.readAsText(f);e.target.value=''}
function makeId(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){} return 't_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
var qab=document.getElementById('quickAddBtn'); function showQuickAdd(e){if(e&&e.preventDefault)e.preventDefault();openModal();} qab.addEventListener('click',showQuickAdd,false);
document.getElementById('searchBox').addEventListener('input',render);
document.getElementById('statusSeg').onclick=e=>{if(e.target.dataset.status){status=e.target.dataset.status;render()}};document.getElementById('viewSeg').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;render()}};
render();
</script>
</body></html>
