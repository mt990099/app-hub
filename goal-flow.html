<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>Goal Flow 3.2</title>
<style>
*{box-sizing:border-box} :root{--bg:#f5f3ee;--card:#fff;--ink:#20252b;--muted:#747b83;--line:#dedbd3;--accent:#334b5e;--soft:#edf1f3;--danger:#b34848}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1040px;margin:auto;padding:18px 16px 90px}
header{display:flex;gap:12px;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.seg{display:flex;background:#e8e6df;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;padding:7px 10px;border-radius:8px}.seg button.on{background:#fff;font-weight:700}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}
.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.head{display:flex;gap:9px;align-items:flex-start}.star{border:0;background:none;font-size:21px;color:#c6c6c6;padding:0}.star.on{color:#c39125}.grow{flex:1;min-width:0}.title{font-weight:800;font-size:17px}.meta,.foot{font-size:12px;color:var(--muted);margin-top:4px}.count{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}.count.bad{background:#fae8e8;color:#9e3333}.next{margin-top:10px;background:#f5f7f8;border-radius:10px;padding:9px;font-size:13px}.miles{margin-top:9px;display:grid;gap:6px}.mile{display:grid;grid-template-columns:22px 58px 1fr;gap:7px;align-items:center;font-size:13px}.mile.done{text-decoration:line-through;color:#999}.mile input{width:17px;height:17px}.progress{height:6px;background:#ecebe7;border-radius:99px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:#6f8494}.cardbuttons{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px}.empty{text-align:center;padding:50px 15px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
.timeline{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:120px}.tlrow{display:grid;grid-template-columns:150px minmax(500px,1fr);gap:12px;align-items:center;margin:12px 0}.track{height:24px;position:relative;border-bottom:2px solid #d8d8d4}.dot{position:absolute;bottom:-7px}.tlname{font-size:13px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(20,24,28,.4);z-index:1000;display:none}.overlay.show{display:block}.screen{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.panel{max-width:720px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.screenhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.screenhead h2{font-size:20px;margin:0}.close{border:0;background:transparent;font-size:24px}
label.lab{display:block;font-weight:700;font-size:13px;margin:13px 0 5px}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mileedit{display:grid;grid-template-columns:145px 1fr 38px;gap:7px;margin:7px 0}.bottom{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.bulktext{width:100%;min-height:210px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}.hint{font-size:12px;color:var(--muted);line-height:1.6}.candidate{display:grid;grid-template-columns:28px 145px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.candidate input[type=date],.candidate input[type=text]{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px}.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 13px;border-radius:10px;display:none;z-index:3000;font-size:13px}

.tagbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tagbar::-webkit-scrollbar{display:none}
.tagpill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;white-space:nowrap;font-size:13px;font-weight:700}
.tagpill.on{background:var(--accent);border-color:var(--accent);color:#fff}.tagpill.add{border-style:dashed}
.cardtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.cardtag{display:inline-flex;align-items:center;gap:4px;background:#eef2f4;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}
.cardtag button{border:0;background:none;padding:0;font-size:14px;color:#777}
.tagrow{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.tagrowtop{display:flex;gap:8px;align-items:center}.tagrowtop input{flex:1}.tagkeys{font-size:12px;color:var(--muted);margin-top:6px}
.checktags{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.checktag{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px}
@media(max-width:650px){.wrap{padding:14px 12px 85px}header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.stats{margin:13px 0}.toolbar{gap:7px}.panel{border:0;border-radius:0;padding:0}.grid2{grid-template-columns:1fr}.mileedit{grid-template-columns:1fr}.mileedit .del{justify-self:end}.candidate{grid-template-columns:28px 1fr;grid-template-rows:auto auto}.candidate .ck{grid-row:1/3}.candidate .datein{grid-column:2}.candidate .titlein{grid-column:2}.screen{background:#fff}.sticky{background:#fff}.tlrow{grid-template-columns:110px minmax(460px,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Goal Flow</h1><div class="sub">ゴールと途中の締切を、ひと目で。</div></div>
<div class="actions"><button class="btn" onclick="openBulk()">✨ ChatGPTから取り込み</button><button class="btn primary" onclick="openEditor()">＋ かんたん登録</button></div></header>
<div class="stats"><div class="stat"><b id="stActive">0</b><span>進行中</span></div><div class="stat"><b id="stSoon">0</b><span>7稼働日以内</span></div><div class="stat"><b id="stOver">0</b><span>期限超過</span></div></div>
<div class="toolbar"><div class="seg" id="statusSeg"><button class="on" data-v="active">進行中</button><button data-v="done">完了済み</button></div><div class="seg" id="viewSeg"><button class="on" data-v="list">一覧</button><button data-v="timeline">タイムライン</button></div><input id="search" class="search" placeholder="検索"><button class="btn" onclick="exportData()">バックアップ</button><label class="btn">復元<input type="file" accept=".json,application/json" hidden onchange="importData(event)"></label><button class="btn" onclick="recoverLocal()">端末内から復元</button></div>
<div id="tagBar" class="tagbar"></div><div id="content"></div>
</div>

<div class="overlay" id="editor"><div class="screen"><div class="panel"><div class="screenhead"><h2 id="editorTitle">かんたん登録</h2><button class="close" onclick="closeEditor()">×</button></div>
<label class="lab">何をする？</label><input id="title" class="field" placeholder="例：研究授業の準備">
<div class="grid2"><div><label class="lab">開始日</label><input id="start" type="date" class="field"></div><div><label class="lab">最終締切</label><input id="final" type="date" class="field"></div></div>
<label class="lab">途中の締切</label><div id="mileEditor"></div><button class="mini" onclick="addMile()">＋ 中間締切を追加</button>
<label class="lab"><input id="weekend" type="checkbox" checked> 残り日数から土日を除外</label>
<label class="lab">タグ</label><div id="editorTags" class="checktags"></div><label class="lab">メモ</label><textarea id="memo" class="field" rows="3"></textarea>
<div class="bottom"><button class="btn" onclick="closeEditor()">キャンセル</button><button class="btn primary" onclick="saveTask()">保存</button></div></div></div></div>

<div class="overlay" id="bulk"><div class="screen"><div class="panel">
<div id="bulkInput"><div class="screenhead"><h2>ChatGPTから取り込み</h2><button class="close" onclick="closeBulk()">×</button></div>
<div class="hint">予定表の写真をChatGPTに送り「Goal Flow用にして」と伝えます。返ってきた文字列をそのまま貼り付けます。<br><b>形式：2026/10/01 | 予定名</b></div>
<textarea id="bulkText" class="bulktext" placeholder="2026/10/01 | 人権（3・4年）&#10;2026/10/01 | あゆみ提出"></textarea>
<div class="bottom"><button class="btn" onclick="pasteText()">📋 貼り付け</button><button class="btn" onclick="closeBulk()">キャンセル</button><button class="btn primary" onclick="parseBulk()">予定を読み取る</button></div></div>
<div id="bulkConfirm" style="display:none"><div class="screenhead"><h2>登録する予定を確認</h2><button class="close" onclick="closeBulk()">×</button></div><div id="candidates"></div><div class="sticky"><button class="btn" onclick="backBulk()">← 入力に戻る</button><button class="btn primary" onclick="commitBulk()">選択した予定を登録</button></div></div>
</div></div></div>
<div class="overlay" id="tagManager"><div class="screen"><div class="panel"><div class="screenhead"><h2>タグと自動分類</h2><button class="close" onclick="closeTags()">×</button></div>
<div class="hint">タグ名と、自動で振り分けたい文言を設定します。キーワードは「WSC, 全体練習」のようにカンマで区切れます。</div>
<div id="tagRows"></div><button class="mini" onclick="newTag()">＋ タグを追加</button>
<div class="bottom"><button class="btn" onclick="closeTags()">閉じる</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='goalflow_v1_tasks'; // 永久固定
const SNAP='goalflow_snapshot_';
const TAGKEY='goalflow_tags_v1'; // タグ設定も固定
const SAFEKEY='goalflow_v1_tasks_lastgood'; // 最後に正常だった予定の保護コピー
function load(k){try{let v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)?v:null}catch(e){return null}}
function taskArray(v){return Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&('title' in x||'finalDate' in x||'milestones' in x))}
function initialTasks(){
  let main=load(KEY);
  if(taskArray(main)&&main.length)return main;
  // KEY自体が消失・破損した場合だけ、最後の正常コピーから自動復元する。
  // 明示的に全件削除した [] は尊重し、勝手に復活させない。
  if(main===null){
    let safe=load(SAFEKEY);
    if(taskArray(safe)&&safe.length){try{localStorage.setItem(KEY,JSON.stringify(safe))}catch(e){};return safe}
    let c=[];
    for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith(SNAP)){let v=load(k);if(taskArray(v)&&v.length)c.push({k,v})}}
    c.sort((a,b)=>b.k.localeCompare(a.k));
    if(c[0]){try{localStorage.setItem(KEY,JSON.stringify(c[0].v))}catch(e){};return c[0].v}
  }
  return taskArray(main)?main:[];
}
let tags=load(TAGKEY)||[], tagFilter='all';
let tasks=initialTasks(), status='active', view='list', editing=null, bulkRows=[];
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(d){return new Date(d+'T00:00:00')} function short(d){if(!d)return'';let a=d.split('-');return (+a[1])+'/'+(+a[2])}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function normalize(t){return {id:t.id||id(),title:t.title||'',startDate:t.startDate||today(),finalDate:t.finalDate||t.startDate||today(),milestones:Array.isArray(t.milestones)?t.milestones.map(m=>({date:m.date||today(),text:m.text||'',done:!!m.done})):[],excludeWeekend:t.excludeWeekend!==false,excludeHolidays:!!t.excludeHolidays,memo:t.memo||'',todayFlag:!!t.todayFlag,completed:!!t.completed,completedAt:t.completedAt||'',createdAt:t.createdAt||new Date().toISOString(),tags:Array.isArray(t.tags)?t.tags:[],excludedTags:Array.isArray(t.excludedTags)?t.excludedTags:[]}}
tasks=tasks.map(normalize);
function snapshot(){try{let v=load(KEY);if(!taskArray(v)||!v.length)return;let raw=JSON.stringify(v);let k=SNAP+new Date().toISOString().replace(/[:.]/g,'-');localStorage.setItem(k,raw);localStorage.setItem(SAFEKEY,raw);let ks=[];for(let i=0;i<localStorage.length;i++){let x=localStorage.key(i);if(x&&x.startsWith(SNAP))ks.push(x)}ks.sort().reverse().slice(20).forEach(x=>localStorage.removeItem(x))}catch(e){}}
function save(){snapshot();localStorage.setItem(KEY,JSON.stringify(tasks));if(tasks.length)localStorage.setItem(SAFEKEY,JSON.stringify(tasks));localStorage.setItem(TAGKEY,JSON.stringify(tags));render()}
function autoTag(t){
 tags.forEach(g=>{
   if(t.excludedTags.includes(g.id))return;
   let hay=(t.title+' '+t.memo+' '+t.milestones.map(m=>m.text).join(' ')).toLowerCase();
   if(g.keys.some(k=>k.trim()&&hay.includes(k.trim().toLowerCase()))&&!t.tags.includes(g.id))t.tags.push(g.id);
 });
 return t;
}
function tagName(x){let g=tags.find(t=>t.id===x);return g?g.name:''}
function removeTag(taskId,tagId){let t=tasks.find(x=>x.id===taskId);if(!t)return;t.tags=t.tags.filter(x=>x!==tagId);if(!t.excludedTags.includes(tagId))t.excludedTags.push(tagId);save()}
function toggleTaskTag(taskId,tagId,on){let t=tasks.find(x=>x.id===taskId);if(!t)return;if(on){if(!t.tags.includes(tagId))t.tags.push(tagId);t.excludedTags=t.excludedTags.filter(x=>x!==tagId)}else removeTag(taskId,tagId);save()}
function renderTagBar(){tagBar.innerHTML=`<button class="tagpill ${tagFilter==='all'?'on':''}" onclick="setTag('all')">すべて</button><button class="tagpill ${tagFilter==='today'?'on':''}" onclick="setTag('today')">★ 今日やる</button>`+tags.map(g=>`<button class="tagpill ${tagFilter===g.id?'on':''}" onclick="setTag('${g.id}')">${esc(g.name)}</button>`).join('')+`<button class="tagpill add" onclick="openTags()">＋タグ</button>`}
function setTag(x){tagFilter=x;render()}
function openTags(){renderTagRows();tagManager.classList.add('show')}
function closeTags(){tagManager.classList.remove('show')}
function renderTagRows(){tagRows.innerHTML=tags.map(g=>`<div class="tagrow"><div class="tagrowtop"><input class="field" value="${esc(g.name)}" onchange="editTag('${g.id}','name',this.value)"><button class="mini" onclick="deleteTag('${g.id}')">削除</button></div><label class="lab">自動分類キーワード</label><input class="field" value="${esc(g.keys.join(', '))}" onchange="editTag('${g.id}','keys',this.value)"><div class="tagkeys">一致した予定に自動でこのタグを付けます。</div></div>`).join('')||'<div class="hint">タグはまだありません。</div>'}
function newTag(){let name=prompt('タグ名を入力してください。例：WSC');if(!name)return;let keys=prompt('自動分類するキーワードをカンマ区切りで入力してください。',name)||'';tags.push({id:'t'+Date.now().toString(36),name:name.trim(),keys:keys.split(',').map(x=>x.trim()).filter(Boolean)});tasks.forEach(autoTag);save();renderTagRows()}
function editTag(x,field,val){let g=tags.find(a=>a.id===x);if(!g)return;if(field==='name')g.name=val.trim();else g.keys=val.split(',').map(x=>x.trim()).filter(Boolean);tasks.forEach(autoTag);save();renderTagRows()}
function deleteTag(x){let g=tags.find(a=>a.id===x);if(!g||!confirm('「'+g.name+'」タグを削除しますか？\n予定そのものは削除されません。'))return;tags=tags.filter(a=>a.id!==x);tasks.forEach(t=>{t.tags=t.tags.filter(a=>a!==x);t.excludedTags=t.excludedTags.filter(a=>a!==x)});if(tagFilter===x)tagFilter='all';save();renderTagRows()}
function workdays(a,b,t){let x=parse(a),y=parse(b),sg=x<=y?1:-1;if(sg<0)[x,y]=[y,x];let n=0,d=new Date(x);while(d<y){d.setDate(d.getDate()+1);let w=d.getDay();if(!(t.excludeWeekend&&(w===0||w===6)))n++}return n*sg}
function next(t){let m=t.milestones.filter(x=>!x.done).slice().sort((a,b)=>a.date.localeCompare(b.date));return m[0]||{date:t.finalDate,text:'最終ゴール'}}
function remain(t,d){return workdays(today(),d,t)}
function render(){renderTagBar();let active=tasks.filter(t=>!t.completed);stActive.textContent=active.length;stSoon.textContent=active.filter(t=>{let r=remain(t,next(t).date);return r>=0&&r<=7}).length;stOver.textContent=active.filter(t=>remain(t,next(t).date)<0).length;
let q=search.value.trim().toLowerCase();let arr=tasks.filter(t=>status==='done'?t.completed:!t.completed).filter(t=>tagFilter==='all'||(tagFilter==='today'?t.todayFlag:t.tags.includes(tagFilter))).filter(t=>!q||(t.title+' '+t.memo+' '+t.milestones.map(m=>m.text).join(' ')).toLowerCase().includes(q));arr.sort((a,b)=>status==='done'?(b.completedAt||'').localeCompare(a.completedAt||''):((b.todayFlag?1:0)-(a.todayFlag?1:0)||next(a).date.localeCompare(next(b).date)));
content.innerHTML=!arr.length?'<div class="empty"><b>'+(status==='done'?'完了済みはまだありません':'進行中の予定はありません')+'</b></div>':view==='list'?'<div class="list">'+arr.map(card).join('')+'</div>':timeline(arr)}
function card(t){let n=next(t),r=remain(t,n.date),all=t.milestones.length+1,done=t.milestones.filter(m=>m.done).length+(t.completed?1:0),pct=Math.round(done/all*100),ct=t.completed?'✓ 完了':r<0?'期限超過 '+Math.abs(r)+'日':r===0?'今日':'あと'+r+'稼働日';
return `<div class="card"><div class="head"><button class="star ${t.todayFlag?'on':''}" onclick="toggleToday('${t.id}')">★</button><div class="grow"><div class="title">${esc(t.title)}</div><div class="meta">開始 ${short(t.startDate)} ・ 最終 ${short(t.finalDate)}</div></div><div class="count ${r<0?'bad':''}">${ct}</div></div>${!t.completed?`<div class="next"><b>次 →</b> ${short(n.date)}　${esc(n.text)}</div>`:''}<div class="miles">${t.milestones.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<label class="mile ${m.done?'done':''}"><input type="checkbox" ${m.done?'checked':''} onchange="toggleMile('${t.id}','${m.date}',${JSON.stringify(m.text).replace(/"/g,'&quot;')})"><span>${short(m.date)}</span><span>${esc(m.text)}</span></label>`).join('')}</div>${t.tags.length?`<div class="cardtags">${t.tags.map(x=>tagName(x)?`<span class="cardtag">${esc(tagName(x))}<button title="この分類から外す" onclick="removeTag(\'${t.id}\',\'${x}\')">×</button></span>`:``).join(\'\')}</div>`:``}<div class="progress"><i style="width:${pct}%"></i></div><div class="foot">進捗 ${pct}% ${t.memo?'・ '+esc(t.memo):''}</div><div class="cardbuttons"><button class="mini" onclick="openEditor('${t.id}')">編集</button><button class="mini" onclick="completeTask('${t.id}')">${t.completed?'進行中に戻す':'完了'}</button><button class="mini" onclick="duplicateTask('${t.id}')">複製</button><button class="mini" onclick="deleteTask('${t.id}')">削除</button></div></div>`}
function timeline(arr){let ds=[];arr.forEach(t=>ds.push(t.startDate,t.finalDate,...t.milestones.map(m=>m.date)));ds.sort();let min=parse(ds[0]),max=parse(ds.at(-1)),span=Math.max(1,(max-min)/86400000),pos=d=>Math.max(0,Math.min(100,(parse(d)-min)/86400000/span*100));return '<div class="timeline">'+arr.map(t=>`<div class="tlrow"><div class="tlname">${esc(t.title)}<div class="meta">次 ${short(next(t).date)}</div></div><div class="track">${t.milestones.map(m=>`<i class="dot" style="left:${pos(m.date)}%">◆</i>`).join('')}<i class="dot" style="left:${pos(t.finalDate)}%">★</i></div></div>`).join('')+'</div>'}
function openEditor(x){editing=x||null;let t=tasks.find(a=>a.id===x);editorTitle.textContent=t?'予定を編集':'かんたん登録';title.value=t?t.title:'';start.value=t?t.startDate:today();final.value=t?t.finalDate:'';weekend.checked=t?t.excludeWeekend:true;memo.value=t?t.memo:'';editorTags.innerHTML=tags.map(g=>`<label class="checktag"><input type="checkbox" data-tag="${g.id}" ${t&&t.tags.includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('');mileEditor.innerHTML='';(t&&t.milestones.length?t.milestones:[null]).forEach(addMile);editor.classList.add('show')}
function closeEditor(){editor.classList.remove('show')}
function addMile(m){let d=document.createElement('div');d.className='mileedit';d.innerHTML=`<input class="field md" type="date" value="${m?m.date:''}"><input class="field mt" placeholder="例：資料完成" value="${m?esc(m.text):''}"><button class="mini del" onclick="this.parentElement.remove()">×</button>`;mileEditor.appendChild(d)}
function saveTask(){if(!title.value.trim()||!start.value||!final.value){alert('タイトル・開始日・最終締切を入力してください。');return}let ms=[...mileEditor.querySelectorAll('.mileedit')].map(r=>({date:r.querySelector('.md').value,text:r.querySelector('.mt').value.trim(),done:false})).filter(m=>m.date&&m.text);let chosen=[...editorTags.querySelectorAll('input[data-tag]:checked')].map(x=>x.dataset.tag);let old=tasks.find(t=>t.id===editing);if(old){ms.forEach(m=>{let p=old.milestones.find(x=>x.date===m.date&&x.text===m.text);if(p)m.done=p.done});Object.assign(old,{title:title.value.trim(),startDate:start.value,finalDate:final.value,milestones:ms,excludeWeekend:weekend.checked,memo:memo.value.trim(),tags:chosen});autoTag(old)}else tasks.push(autoTag(normalize({title:title.value.trim(),startDate:start.value,finalDate:final.value,milestones:ms,excludeWeekend:weekend.checked,memo:memo.value.trim(),tags:chosen})));closeEditor();save()}
function toggleToday(x){let t=tasks.find(a=>a.id===x);t.todayFlag=!t.todayFlag;save()} function toggleMile(x,d,tx){let t=tasks.find(a=>a.id===x),m=t.milestones.find(a=>a.date===d&&a.text===tx);if(m)m.done=!m.done;save()}
function completeTask(x){let t=tasks.find(a=>a.id===x);t.completed=!t.completed;t.completedAt=t.completed?new Date().toISOString():'';save()} function duplicateTask(x){let t=JSON.parse(JSON.stringify(tasks.find(a=>a.id===x)));t.id=id();t.title+='（コピー）';t.completed=false;t.completedAt='';t.milestones.forEach(m=>m.done=false);tasks.push(t);save()}
function deleteTask(x){if(confirm('この予定を削除しますか？')){tasks=tasks.filter(a=>a.id!==x);save()}}
function openBulk(){bulkInput.style.display='block';bulkConfirm.style.display='none';bulkText.value='';bulk.classList.add('show')} function closeBulk(){bulk.classList.remove('show')} function backBulk(){bulkInput.style.display='block';bulkConfirm.style.display='none'}
async function pasteText(){try{bulkText.value=await navigator.clipboard.readText()}catch(e){bulkText.focus();alert('入力欄を長押しして「ペースト」を選んでください。')}}
function parseBulk(){let lines=bulkText.value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);bulkRows=[];for(let l of lines){let m=l.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})\s*(?:\||｜|:|：|\t)\s*(.+)$/);if(m)bulkRows.push({date:m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'),title:m[4].trim(),use:true})}if(!bulkRows.length){alert('予定を読み取れませんでした。「2026/10/01 | 予定名」の形式を確認してください。');return}candidates.innerHTML=bulkRows.map((r,i)=>`<div class="candidate"><input class="ck" type="checkbox" checked onchange="bulkRows[${i}].use=this.checked"><input class="datein" type="date" value="${r.date}" onchange="bulkRows[${i}].date=this.value"><input class="titlein" value="${esc(r.title)}" onchange="bulkRows[${i}].title=this.value"></div>`).join('');bulkInput.style.display='none';bulkConfirm.style.display='block';bulk.querySelector('.screen').scrollTop=0}
function commitBulk(){let a=bulkRows.filter(r=>r.use&&r.date&&r.title.trim());a.forEach(r=>tasks.push(autoTag(normalize({title:r.title.trim(),startDate:today(),finalDate:r.date,memo:'ChatGPTから取り込み'}))));closeBulk();save();toastMsg(a.length+'件登録しました')}
function exportData(){let b=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='goalflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('現在のデータをこのバックアップで置き換えますか？')){snapshot();tasks=d.map(normalize).map(autoTag);save()}}catch{alert('バックアップを読み込めませんでした。')}};r.readAsText(f);e.target.value=''}
function recoverLocal(){let c=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!(k===KEY||k===SAFEKEY||k.startsWith(SNAP)))continue;let v=load(k);if(taskArray(v)&&v.length)c.push({k,v})}c.sort((a,b)=>{if(a.k===SAFEKEY)return-1;if(b.k===SAFEKEY)return 1;return b.k.localeCompare(a.k)});if(!c.length){alert('このURLの端末内に復元できる予定データはありません。');return}let msg=c.slice(0,10).map((x,i)=>(i+1)+'：'+x.v.length+'件　'+(x.k===SAFEKEY?'保護コピー':x.k===KEY?'現在のデータ':'自動バックアップ')).join('\n'),n=prompt('復元候補の番号を入力してください。\n\n'+msg,'1'),x=c[+n-1];if(x&&confirm(x.v.length+'件を復元しますか？')){snapshot();tasks=x.v.map(normalize);localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(SAFEKEY,JSON.stringify(tasks));render();toastMsg('予定を復元しました')}}
function toastMsg(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}
statusSeg.onclick=e=>{if(e.target.dataset.v){status=e.target.dataset.v;[...statusSeg.children].forEach(b=>b.classList.toggle('on',b.dataset.v===status));render()}};viewSeg.onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;[...viewSeg.children].forEach(b=>b.classList.toggle('on',b.dataset.v===view));render()}};search.oninput=render;
snapshot();render();
</script>
</body></html>
