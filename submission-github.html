<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提出チェック GitHub診断版</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f8ff;color:#344054}
.wrap{max-width:760px;margin:auto;padding:18px}
.home{display:inline-block;text-decoration:none;background:#fff;color:#526177;padding:9px 13px;border-radius:999px;font-weight:900}
.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 22px rgba(50,65,95,.10)}
h1{text-align:center;margin:6px 0 10px}
.badge{background:#5b91e5;color:#fff;border-radius:999px;padding:4px 9px;font-size:13px}
.ok{color:#248557;font-weight:900}.ng{color:#bc4f4f;font-weight:900}.wait{color:#8a6e1d;font-weight:900}
button{border:0;border-radius:14px;padding:12px 18px;background:#5b91e5;color:white;font-size:17px;font-weight:900}
pre{background:#f7f8fb;padding:10px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="./index.html">🏠 アプリ集に戻る</a>

<div class="card">
<h1>📚 提出チェック <span class="badge">GitHub診断版</span></h1>
<p style="text-align:center">この画面が見えていれば、HTML表示は正常です。</p>
</div>

<div class="card">
<strong>① HTML</strong>
<div class="ok">✅ 表示できています</div>
</div>

<div class="card">
<strong>② JavaScript</strong>
<div id="js" class="wait">確認中…</div>
</div>

<div class="card">
<strong>③ iPad内保存（localStorage）</strong>
<div id="storage" class="wait">確認中…</div>
</div>

<div class="card">
<strong>④ 既存の提出データ</strong>
<div id="data" class="wait">確認中…</div>
<pre id="detail"></pre>
</div>

<div class="card">
<strong>⑤ ボタン</strong><br><br>
<button id="btn" type="button">ここを押す</button>
<div id="btnResult" style="margin-top:10px"></div>
</div>

<div class="card">
<strong>エラー情報</strong>
<pre id="error">エラーなし</pre>
</div>
</div>

<script>
const errorEl=document.getElementById('error');

window.addEventListener('error', e=>{
  errorEl.textContent='JavaScriptエラー: '+e.message+' / line '+e.lineno;
});

window.addEventListener('unhandledrejection', e=>{
  errorEl.textContent='Promiseエラー: '+String(e.reason);
});

try{
  const el=document.getElementById('js');
  el.className='ok';
  el.textContent='✅ JavaScriptは動いています';
}catch(e){
  errorEl.textContent=String(e);
}

try{
  localStorage.setItem('__github_test__','OK');
  const v=localStorage.getItem('__github_test__');
  localStorage.removeItem('__github_test__');
  const el=document.getElementById('storage');
  if(v==='OK'){
    el.className='ok';
    el.textContent='✅ localStorageを使用できます';
  }else{
    el.className='ng';
    el.textContent='❌ 保存値を読み戻せません';
  }
}catch(e){
  const el=document.getElementById('storage');
  el.className='ng';
  el.textContent='❌ localStorageを使用できません';
  errorEl.textContent=String(e);
}

try{
  const raw=localStorage.getItem('submission-check-v1');
  const el=document.getElementById('data');
  const detail=document.getElementById('detail');
  if(!raw){
    el.className='ok';
    el.textContent='✅ 既存データなし（正常）';
    detail.textContent='GitHub版では新しい保存領域になる場合があります。';
  }else{
    const d=JSON.parse(raw);
    el.className='ok';
    el.textContent='✅ 既存データを読めました';
    detail.textContent=
      '年度: '+d.year+
      '\n学年: '+d.grade+
      '\n組: '+d.classNo+
      '\n人数: '+d.count+
      '\n項目数: '+(Array.isArray(d.items)?d.items.length:'不明');
  }
}catch(e){
  const el=document.getElementById('data');
  el.className='ng';
  el.textContent='❌ 既存データの読み込みでエラー';
  errorEl.textContent=String(e);
}

document.getElementById('btn').addEventListener('click', ()=>{
  document.getElementById('btnResult').innerHTML='<span class="ok">✅ ボタンも動いています</span>';
});
</script>
</body>
</html>
