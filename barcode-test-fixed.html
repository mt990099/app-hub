<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>共通バーコード作成｜アプリ集</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#354052;background:#f4fbf7}
.wrap{max-width:980px;margin:auto;padding:16px}
.home{display:inline-block;text-decoration:none;color:#526177;background:#fff;border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 5px 15px rgba(60,70,90,.1)}
h1{text-align:center;margin:14px 0 6px}.sub{text-align:center;color:#778190;margin-bottom:18px}
.panel{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(60,80,70,.1);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-weight:800;font-size:14px}input{width:100%;padding:11px;border:2px solid #e0e7e3;border-radius:13px;font-size:17px;margin-top:5px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:16px;cursor:pointer}
.primary{background:#58b786;color:white}.secondary{background:#edf2f7;color:#465367}
.sheet-title{text-align:center;font-weight:900;font-size:18px;margin:0 0 5px}
.sheet-sub{text-align:center;font-size:12px;color:#687482;margin-bottom:8px}
.barcode-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.barcode-card{border:1px solid #cfd6d2;border-radius:5px;padding:3px 4px;text-align:center;background:#fff;min-height:22mm;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.student-label{font-weight:900;font-size:11px;line-height:1.2}
.barcode-svg{width:100%;height:9mm;margin:1px 0}
.code-text{font-size:7px;letter-spacing:.02em;white-space:nowrap}
.note{font-size:12px;color:#697483;line-height:1.6}
.test{margin-top:10px;background:#eef9f2;border-radius:13px;padding:10px 12px;font-size:13px;font-weight:800;color:#397b59}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}
@media print{
 @page{size:A4 landscape;margin:6mm}body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}.panel{box-shadow:none;padding:0;margin:0}
 .barcode-grid{grid-template-columns:repeat(5,1fr);gap:2mm 2mm}.barcode-card{min-height:21.5mm;break-inside:avoid}.sheet-title{font-size:15px}.sheet-sub{font-size:9px;margin-bottom:3mm}
}
</style>
</head>
<body>
<div class="wrap">
<div class="no-print"><a class="home" href="./index.html">🏠 アプリ集に戻る</a></div>
<h1 class="no-print">🏷️ 共通バーコード作成</h1>
<div class="sub no-print">出席・評価・提出チェックで同じバーコードを使えます。</div>
<div class="panel no-print">
<div class="grid">
<label>年度<input id="year" type="number" value="2026" min="2020" max="2100"></label>
<label>学年<input id="grade" type="number" value="6" min="1" max="6"></label>
<label>組<input id="classNo" type="number" value="1" min="1" max="9"></label>
<label>人数<input id="count" type="number" value="38" min="1" max="40"></label>
</div>
<div class="actions"><button class="primary" onclick="generate()">バーコード表を作る</button><button class="secondary" onclick="window.print()">A4横で印刷</button></div>
<p class="note">共通ID形式：<strong>年度-学年-組-出席番号</strong>（例：2026-6-2-17）。児童名は入れません。</p>
<div id="test" class="test"></div>
</div>
<div class="panel"><div id="sheetTitle" class="sheet-title"></div><div id="sheetSub" class="sheet-sub"></div><div id="barcodeGrid" class="barcode-grid"></div></div>
</div>
<script>
const CODE128_PATTERNS=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];

function code128SVG(text,height=42){
 for(const ch of text){const c=ch.charCodeAt(0);if(c<32||c>126)throw new Error('Code128-Bで扱えない文字があります');}
 const codes=[104];
 for(const ch of text)codes.push(ch.charCodeAt(0)-32);
 let checksum=104;
 for(let i=1;i<codes.length;i++)checksum+=codes[i]*i;
 checksum%=103;
 codes.push(checksum,106);

 const quiet=10, modules=[];
 for(const code of codes){
   const pattern=CODE128_PATTERNS[code];
   for(let i=0;i<pattern.length;i++)modules.push({bar:i%2===0,width:Number(pattern[i])});
 }
 // Code 128 requires a final 2-module termination bar after the stop symbol.
 modules.push({bar:true,width:2});

 const total=modules.reduce((s,m)=>s+m.width,0)+quiet*2;
 let x=quiet,rects='';
 for(const m of modules){
   if(m.bar)rects+=`<rect x="${x}" y="0" width="${m.width}" height="${height}" fill="#000"/>`;
   x+=m.width;
 }
 return `<svg class="barcode-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${height}" preserveAspectRatio="none" aria-label="${text}">${rects}</svg>`;
}
function pad2(n){return String(n).padStart(2,'0');}
function generate(){
 const year=Number(document.getElementById('year').value),grade=Number(document.getElementById('grade').value),classNo=Number(document.getElementById('classNo').value),count=Number(document.getElementById('count').value);
 if(!year||grade<1||grade>6||classNo<1||classNo>9||count<1||count>40){alert('設定を確認してください。人数は1〜40人です。');return;}
 document.getElementById('sheetTitle').textContent=`${year}年度　${grade}年${classNo}組　共通バーコード`;
 document.getElementById('sheetSub').textContent='出席・評価・提出チェック 共通';
 const grid=document.getElementById('barcodeGrid');grid.innerHTML='';
 for(let n=1;n<=count;n++){
   const id=`${year}-${grade}-${classNo}-${pad2(n)}`;
   const card=document.createElement('div');card.className='barcode-card';
   card.innerHTML=`<div class="student-label">${grade}年${classNo}組　${n}番</div>${code128SVG(id)}<div class="code-text">${id}</div>`;
   grid.appendChild(card);
 }
 document.getElementById('test').textContent=`読み取り確認用：1番 ${year}-${grade}-${classNo}-01 ／ 2番 ${year}-${grade}-${classNo}-02 ／ 最終 ${year}-${grade}-${classNo}-${pad2(count)}`;
}
generate();
</script>
</body>
</html>
